<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaWang Admin Console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-grid"></div>

    <!-- Login Screen -->
    <section class="login-wrapper" id="login-card">
      <div class="login-card">
        <div class="brand-centered">
          <span class="brand-mark">K</span>
          <h2>KaWang Admin</h2>
          <p>请输入管理员凭据以访问控制台</p>
        </div>
        <form id="login-form" class="stack">
          <label class="field">
            <span>管理员账号</span>
            <input id="username" placeholder="账号" value="admin" />
          </label>
          <label class="field">
            <span>管理员密码</span>
            <input id="password" type="password" placeholder="密码" />
          </label>
          <button type="submit" class="primary-btn">登录系统</button>
        </form>
        <div id="login-result" class="hint centered"></div>
      </div>
    </section>

    <!-- Admin Shell -->
    <div id="admin-shell" class="admin-layout hidden">
      <aside class="sidebar">
        <div class="sidebar-header">
          <a class="brand" href="#">
            <span class="brand-mark">K</span>
            <div class="brand-copy">
              <strong>KaWang</strong>
              <small>Ops Console</small>
            </div>
          </a>
        </div>
        
        <nav class="sidebar-nav">
          <button class="nav-item active" data-tab="dashboard">
            <span class="icon">📊</span> 仪表盘
          </button>
          <button class="nav-item" data-tab="sites">
            <span class="icon">🌐</span> 网站管理
          </button>
          <button class="nav-item" data-tab="cards">
            <span class="icon">🎫</span> 卡密管理
          </button>
          <button class="nav-item" data-tab="jobs">
            <span class="icon">⚙️</span> 任务中心
          </button>
          <button class="nav-item" data-tab="logs">
            <span class="icon">📝</span> 操作日志
          </button>
          <button class="nav-item" data-tab="subscriptions">
            <span class="icon">📋</span> 订阅系统
          </button>
          <button class="nav-item" data-tab="system">
            <span class="icon">🔄</span> 系统更新
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="user-info">
            <span id="session-status">admin</span>
          </div>
          <div class="footer-actions">
            <button id="refresh-btn" class="icon-btn" title="刷新数据">🔄</button>
            <button id="logout-btn" class="icon-btn" title="退出登录">🚪</button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <!-- Dashboard -->
        <section class="tab-panel" data-panel="dashboard">
          <div class="content-header">
            <h2>仪表盘</h2>
            <p>系统运行概览与最近活动</p>
          </div>
          <section class="stats" id="stats"></section>
          <div class="card mt-24">
            <div class="card-header">
              <h3>最近 5 条日志</h3>
            </div>
            <div id="dashboard-logs" class="table-wrapper"></div>
          </div>
        </section>

        <!-- Sites -->
        <section class="tab-panel hidden" data-panel="sites">
          <div class="content-header">
            <h2>网站管理</h2>
            <div class="header-actions">
              <button id="health-check-all-btn" class="primary-btn">全部测活</button>
            </div>
          </div>
          <div class="card">
            <div id="site-list" class="table-wrapper"></div>
            <div id="site-result" class="hint footer-hint">站点配置由代码维护，此处仅用于查看状态、手动开关和测活。</div>
          </div>
        </section>

        <!-- Cards -->
        <section class="tab-panel hidden" data-panel="cards">
          <div class="content-header">
            <h2>卡密管理</h2>
          </div>
          
          <div class="grid grid-2">
            <div class="card">
              <div class="card-header"><h3>单次添加</h3></div>
              <form id="single-cdkey-form" class="stack">
                <label class="field">
                  <span>归属网站</span>
                  <select id="single-site"></select>
                </label>
                <label class="field">
                  <span>原始卡密</span>
                  <input id="single-source-key" placeholder="输入一条原始卡密" />
                </label>
                <label class="field">
                  <span>混淆前缀</span>
                  <input id="single-prefix" placeholder="例如 GPT" />
                </label>
                <button type="submit" class="primary-btn">添加卡密</button>
              </form>
              <div id="single-cdkey-result" class="hint"></div>
            </div>

            <div class="card">
              <div class="card-header"><h3>批量导入</h3></div>
              <form id="batch-form" class="stack">
                <div class="grid grid-2">
                  <label class="field">
                    <span>归属网站</span>
                    <select id="batch-site"></select>
                  </label>
                  <label class="field">
                    <span>混淆前缀</span>
                    <input id="batch-prefix" placeholder="例如 GPT" />
                  </label>
                </div>
                <label class="field">
                  <span>批次名称</span>
                  <input id="batch-name" placeholder="本次导入名称" />
                </label>
                <label class="field">
                  <span>原始卡密</span>
                  <textarea id="batch-raw-keys" rows="4" placeholder="每行一条原始卡密"></textarea>
                </label>
                <button type="submit" class="primary-btn">开始导入</button>
              </form>
              <div id="batch-result" class="hint"></div>
            </div>
          </div>

          <div class="card mt-24">
            <div class="card-header"><h3>导入批次历史</h3></div>
            <div id="batch-list" class="table-wrapper"></div>
          </div>

          <div class="card mt-24">
            <div class="card-header">
              <h3>卡密明细</h3>
              <div class="header-actions">
                <select id="cdkey-action" class="small-select">
                  <option value="enable">批量启用</option>
                  <option value="disable">批量禁用</option>
                  <option value="void">批量作废</option>
                  <option value="reset">重置为可用</option>
                </select>
                <button id="cdkey-action-btn" class="primary-btn small">执行</button>
              </div>
            </div>
            <div id="cdkey-list" class="table-wrapper"></div>
          </div>
        </section>

        <!-- Jobs -->
        <section class="tab-panel hidden" data-panel="jobs">
          <div class="content-header">
            <h2>任务中心</h2>
          </div>
          <div class="card">
            <div class="card-header"><h3>兑换订单</h3></div>
            <div id="order-list" class="table-wrapper"></div>
          </div>
          <div class="card mt-24">
            <div class="card-header">
              <h3>激活任务</h3>
              <div class="header-actions">
                <button id="retry-jobs-btn" class="primary-btn small">重试选中</button>
              </div>
            </div>
            <div id="job-list" class="table-wrapper"></div>
          </div>
        </section>

        <!-- Logs -->
        <section class="tab-panel hidden" data-panel="logs">
          <div class="content-header">
            <h2>操作日志</h2>
          </div>
          <div class="card">
            <div id="log-list" class="table-wrapper"></div>
          </div>
        </section>

        <!-- Subscriptions -->
        <section class="tab-panel hidden" data-panel="subscriptions">
          <div class="content-header">
            <h2>订阅系统</h2>
            <p>管理订阅卡种与审批订阅申请</p>
          </div>

          <div class="card">
            <div class="card-header"><h3>新增卡种</h3></div>
            <form id="sub-card-type-form" class="stack">
              <div class="grid grid-2">
                <label class="field">
                  <span>卡种名称</span>
                  <input id="sub-ct-name" placeholder="输入卡种名称" />
                </label>
                <label class="field">
                  <span>总订阅量</span>
                  <input id="sub-ct-total" type="number" min="0" placeholder="不填默认为 0" />
                </label>
              </div>
              <input type="hidden" id="sub-ct-edit-id" value="" />
              <div class="header-actions">
                <button type="submit" class="primary-btn" id="sub-ct-submit-btn">添加卡种</button>
                <button type="button" class="ghost-btn hidden" id="sub-ct-cancel-btn">取消编辑</button>
              </div>
            </form>
            <div id="sub-ct-result" class="hint"></div>
          </div>

          <div class="card mt-24">
            <div class="card-header"><h3>卡种列表</h3></div>
            <div id="sub-card-type-list" class="table-wrapper"></div>
          </div>

          <div class="card mt-24">
            <div class="card-header"><h3>订阅申请</h3></div>
            <div id="sub-request-list" class="table-wrapper"></div>
          </div>
        </section>

        <!-- System -->
        <section class="tab-panel hidden" data-panel="system">
          <div class="content-header">
            <h2>系统更新</h2>
          </div>
          <div class="grid grid-2">
            <div class="card">
              <div class="card-header"><h3>版本信息</h3></div>
              <section class="stats small" id="system-version-cards"></section>
              <div class="action-row mt-16">
                <button id="check-update-btn" class="primary-btn">检查更新</button>
                <button id="start-update-btn" class="ghost-btn">在线更新</button>
              </div>
              <p class="hint mt-12" id="system-update-hint"></p>
            </div>
            <div class="card">
              <div class="card-header"><h3>更新日志</h3></div>
              <pre id="system-update-log" class="log-viewer">暂无日志</pre>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./runtime-config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
