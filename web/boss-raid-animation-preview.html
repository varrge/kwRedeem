<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>北境远征 · 古堡战场</title>
<link rel="stylesheet" href="./raid-arena.css"/>
<style>
*{box-sizing:border-box}body{margin:0;background:#141f2c;color:#e6eff0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #dfc398;outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 4%;border-bottom:1px solid #abc8d11c;gap:20px}.brand{letter-spacing:.18em;font-size:12px;color:#b6cccf}.brand b{color:#e9c49a;margin-right:14px;font-size:18px}.notice{font-size:11px;color:#92a7b3}
.theater{position:relative;height:700px;min-height:560px}#preview-boss{position:absolute;inset:0}.intro{position:absolute;left:6%;top:70px;pointer-events:none;z-index:2}.intro .eyebrow{font-size:11px;color:#b8bda7;letter-spacing:.22em}.intro h1{font-size:40px;line-height:1.25;font-weight:500;letter-spacing:.02em;margin:12px 0}.intro p{font-size:12px;color:#a5b9bd;max-width:300px}.status{position:absolute;left:6%;bottom:85px;z-index:2;font-size:11px;color:#adc0c6}
.health{position:absolute;left:6%;bottom:25px;width:38%;z-index:2}.health-head{display:flex;justify-content:space-between;color:#d6dfdf;font-size:11px;letter-spacing:.12em;margin-bottom:8px}.track{height:5px;background:#080c1944;border-radius:5px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#bc8c61,#f1d1a1);transition:width .3s}
.controls{position:absolute;right:6%;bottom:30px;z-index:3;display:flex;gap:7px;flex-wrap:wrap;width:39%;justify-content:flex-end}.controls button{background:#0f20319e;border:1px solid #cfdae72e;color:#d2e5e7;border-radius:6px;padding:8px 12px;font-size:11px}.controls .primary{background:#d7bb92;color:#1b2630;border-color:#d7bb92}.controls label{font-size:11px;color:#b1c4cb;width:100%;text-align:right}.controls input{width:135px;vertical-align:middle;accent-color:#d7bb92;margin-left:10px}.controls select{font:11px ui-monospace,monospace;color:#e6e5d6;background:#162635;border:1px solid #aac5d540;border-radius:5px;padding:6px;margin-left:8px}
.roster{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;padding:0 4% 22px}.roster button{padding:14px 10px;border:1px solid #bdced421;border-radius:9px;background:#102030;color:#c3d1d5;text-align:left;font-size:12px;min-height:82px}.roster button span{display:block;color:#7c95a7;font-size:10px;margin-bottom:8px;letter-spacing:.08em}.roster button[aria-pressed="true"]{border-color:#c8b392;background:#343c40;color:#f5dfb8}.roster button[aria-pressed="true"] span{color:#c4b38f}
footer{padding:0 20px 24px;text-align:center;color:#839aa8;font-size:11px}footer a{color:#b8c8c9}.legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;color:#839aa8;font-size:11px;padding:0 15px 18px}.legend b{color:#d7bb92;font-weight:400}
@media(min-width:1500px){.theater{height:770px}}
@media(max-width:1000px){.roster{grid-template-columns:repeat(4,1fr)}.controls{right:3%;width:46%}.intro{left:3%}.health{left:3%;width:43%}}
@media(max-width:650px){header{padding:16px 18px;gap:10px}.notice{font-size:10px;max-width:138px}.brand{font-size:10px;letter-spacing:.1em}.theater{height:810px}.intro{top:86px;max-width:46%;left:4%}.intro h1{font-size:26px}.intro p{font-size:10px}.health{left:4%;width:92%;bottom:200px}.status{left:4%;bottom:246px}.controls{left:4%;width:92%;bottom:26px;justify-content:center}.controls label{text-align:center}.roster{grid-template-columns:repeat(2,1fr);padding:0 4% 20px}.roster button{min-height:64px}.theater .raid-scene-tag{bottom:300px}.legend{font-size:10px}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
<link rel="stylesheet" href="./raid-nordic.css"/>
</head>
<body class="nordic-preview">
<header><div class="brand"><b>◇</b>KAWANG / 北境远征</div><div class="notice">美术预览 · 模拟数据<br>操作不影响正式活动</div></header>
<main>
<section class="theater" aria-label="Boss 与参战小队的3D对阵">
<div id="preview-boss"></div>
<div class="intro"><span class="eyebrow" id="scene-name"></span><h1 id="boss-title"></h1><p>北境风雪之中，集结讨伐小队。<br>拖动环顾战场，滚轮或双指缩放。</p></div>
<div class="status" id="state-label" role="status">战斗中</div>
<div class="health"><div class="health-head"><span>BOSS 耐久</span><span id="health-value">2,000 / 2,000</span></div><div class="track"><div id="health-fill" class="fill" style="width:100%"></div></div></div>
<div class="controls"><label for="attacker">本次消费玩家<select id="attacker"></select></label><button class="primary" id="hit" type="button">模拟此人消耗 10 额度</button><button id="defeat" type="button">确认击败</button><button id="dormant" type="button">中止</button><button id="reset" type="button">重置</button><button id="motion" type="button" aria-pressed="false">暂停动画</button><label for="health">剩余血量<input id="health" type="range" min="0" max="100" value="100"/></label></div>
</section>
<div class="legend"><span><b>左侧</b> 首领与专属场景</span><span><b>右侧</b> 参战小队 · 可翻页</span><span><b>脱敏昵称</b> 与贡献榜一致</span></div>
<nav class="roster" id="roster" aria-label="切换 Boss 和场景"></nav>
</main>
<footer>首领：<a id="boss-art-credit" target="_blank"></a> · 人物：<a href="./assets/raid-3d/nordic-heroes/CREDITS.md" target="_blank">Clement Wu、Nikolaus、Botanic · CC BY 3.0</a> · 石材：<a href="./assets/raid-3d/nordic-textures/CREDITS.md" target="_blank">Rob Tuytel / Poly Haven · CC0</a> · 预览均为模拟数据</footer>
<script src="./raid-arena-preview.js"></script>
<script>
const host=document.querySelector("#preview-boss");
const visual=RaidArena.create(host);
const participants=Array.from({length:6},(_,i)=>({publicId:"demo-enrollment-"+i,maskedName:["霜***客","北***星","夜***风","云***川","寒***月","星***火"][i],damage:0,own:i===0}));
for(const participant of participants){const option=document.createElement("option");option.value=participant.publicId;option.textContent=participant.maskedName;document.querySelector("#attacker").append(option);}
let boss, paused=false,campaign="active",simulationRound=0;
function draw(){
 if(!visual){document.querySelector("#state-label").textContent="浏览器不支持3D，请使用支持WebGL的浏览器。";return;}
 visual.update(boss,campaign);
 visual.updateParticipants(participants,participants.length,boss.id,true);
 const pct=boss.remainingHealth/boss.health*100;
 document.querySelector("#health").value=pct;
 document.querySelector("#health-value").textContent=boss.remainingHealth.toLocaleString()+" / 2,000";
 document.querySelector("#health-fill").style.width=pct+"%";
 document.querySelector("#state-label").textContent={idle:"战斗中 · 小队已集结",enraged:"目标狂暴 · 加紧进攻",unstable:"濒临击败 · 等待结算确认",defeated:"目标已击败",dormant:"活动已中止"}[host.dataset.state]||"";
}
function select(key){
 campaign="active";boss={id:"preview-"+key+"-"+(++simulationRound),assetKey:key,name:RaidArena.scenes[key].title,health:2000,remainingHealth:2000,totalDamage:0,status:"active"};
 participants.forEach(p=>p.damage=0);
 document.querySelector("#boss-title").textContent=boss.name;document.querySelector("#scene-name").textContent=RaidArena.scenes[key].name+" / PVE";
 const art=RaidArena.credits[key],creditLink=document.querySelector("#boss-art-credit");creditLink.textContent=art.credit+" · "+art.license;creditLink.href=art.source;
 for(const b of document.querySelectorAll("[data-boss]"))b.setAttribute("aria-pressed",String(b.dataset.boss===key));draw();
}
Object.entries(RaidArena.scenes).forEach(([key,s],index)=>{const b=document.createElement("button");b.type="button";b.dataset.boss=key;const tag=document.createElement("span");tag.textContent=String(index+1).padStart(2,"0")+" / "+s.name;b.append(tag,document.createTextNode(s.title));b.addEventListener("click",()=>select(key));document.querySelector("#roster").append(b);});
document.querySelector("#hit").addEventListener("click",()=>{if(boss.status!=="active"||campaign!=="active")return;const player=participants.find(p=>p.publicId===document.querySelector("#attacker").value);if(!player)return;const damage=10*1.2;player.damage+=damage;boss.remainingHealth=Math.max(0,boss.remainingHealth-damage);boss.totalDamage+=damage;if(!boss.remainingHealth)boss.status="settling";draw();visual?.hit();});
document.querySelector("#defeat").addEventListener("click",()=>{boss.status="defeated";boss.remainingHealth=0;draw();});
document.querySelector("#dormant").addEventListener("click",()=>{campaign="aborted";draw();});
document.querySelector("#reset").addEventListener("click",()=>select(boss.assetKey));
document.querySelector("#health").addEventListener("input",e=>{boss.remainingHealth=Number(e.target.value)*20;boss.status=boss.remainingHealth?"active":"settling";campaign="active";draw();});
document.querySelector("#motion").addEventListener("click",e=>{paused=!paused;visual?.setPaused(paused);e.target.textContent=paused?"继续动画":"暂停动画";e.target.setAttribute("aria-pressed",String(paused));});
window.addEventListener("pagehide",e=>{if(!e.persisted)visual?.destroy();});
select("leviathan");
</script>
</body>
</html>
