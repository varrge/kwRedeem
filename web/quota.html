<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaWang 提号系统 - 客户提号</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .quota-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        margin-bottom: 24px;
      }

      .stock-banner {
        margin-bottom: 24px;
      }

      .stock-banner .stock-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .quota-stats {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 24px;
      }

      .quota-stat-card {
        padding: 20px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        text-align: center;
      }

      .quota-stat-card .label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }

      .quota-stat-card .value {
        font-size: 28px;
        font-weight: 800;
        background: linear-gradient(135deg, #fff, #b2c5ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .quota-stat-card .value.exhausted {
        background: linear-gradient(135deg, var(--error), #ff5577);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .warning-box {
        padding: 16px 20px;
        border-radius: 16px;
        background: rgba(255, 213, 138, 0.08);
        border: 1px solid rgba(255, 213, 138, 0.25);
        margin-bottom: 20px;
        display: none;
      }

      .warning-box.visible {
        display: block;
      }

      .warning-box .warning-title {
        font-weight: 700;
        color: #ffd58a;
        margin-bottom: 6px;
        font-size: 15px;
      }

      .warning-box .warning-message {
        color: #e8d5a8;
        font-size: 14px;
        line-height: 1.5;
      }

      .claim-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: end;
      }

      .claim-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .claim-form .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .claim-form .field-label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }

      .claim-form input {
        border-radius: 16px;
      }

      .claim-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .claim-actions button {
        white-space: nowrap;
        padding: 16px 28px;
      }

      .auto-claim-status {
        margin-top: 12px;
      }

      .status-message {
        margin-top: 16px;
        padding: 14px 18px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }

      .status-message.exhausted {
        background: rgba(255, 127, 159, 0.08);
        border: 1px solid rgba(255, 127, 159, 0.2);
        color: var(--error);
      }

      .status-message.no-stock {
        background: rgba(255, 213, 138, 0.08);
        border: 1px solid rgba(255, 213, 138, 0.2);
        color: #ffd58a;
      }

      .accounts-panel {
        margin-top: 24px;
        display: none;
      }

      .accounts-panel.visible {
        display: block;
      }

      .accounts-panel .accounts-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--success);
      }

      .account-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        margin-bottom: 8px;
        gap: 12px;
      }

      .account-row .account-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: var(--text);
        word-break: break-all;
        flex: 1;
      }

      .copy-btn {
        background: rgba(94, 120, 200, 0.12);
        border: 1px solid rgba(125, 154, 255, 0.2);
        color: var(--primary);
        padding: 6px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }

      .copy-btn:hover {
        background: rgba(94, 120, 200, 0.2);
        border-color: var(--primary);
      }

      .copy-btn.copied {
        background: rgba(67, 213, 159, 0.15);
        border-color: var(--success);
        color: var(--success);
      }

      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .history-title {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
        color: var(--text);
      }

      .history-actions {
        display: flex;
        gap: 10px;
      }

      .history-btn {
        padding: 10px 18px !important;
        font-size: 13px !important;
        border-radius: 12px !important;
      }

      .history-empty {
        text-align: center;
        padding: 32px 16px;
        color: var(--muted);
        font-size: 15px;
      }

      .history-record {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        margin-bottom: 10px;
        transition: background 0.2s;
      }

      .history-record:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .history-record:last-child {
        margin-bottom: 0;
      }

      .history-time {
        font-size: 13px;
        color: var(--muted);
      }

      .history-amount {
        font-size: 14px;
        font-weight: 700;
        color: var(--primary);
        white-space: nowrap;
      }

      .history-accounts {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }

      .history-record-accounts {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .history-account-item {
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
        color: var(--text);
        word-break: break-all;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
      }

      @media (max-width: 600px) {
        .quota-stats { grid-template-columns: 1fr; }
        .claim-form { grid-template-columns: 1fr; }
        .claim-fields { grid-template-columns: 1fr; }
        .claim-actions { width: 100%; }
        .claim-actions button { width: 100%; }
        .quota-panel { padding: 20px; }
        .quota-stat-card .value { font-size: 22px; }
        .history-header { flex-direction: column; align-items: flex-start; }
        .history-record { grid-template-columns: 1fr; gap: 8px; }
      }
    </style>
    <link rel="stylesheet" href="./apple-design.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-grid"></div>

    <main class="page">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">K</span>
          <span class="brand-copy">
            <strong>KaWang</strong>
            <small>Quota Portal</small>
          </span>
        </a>
        <nav class="topnav">
          <a href="./index.html" class="nav-btn">兑换中心</a>
          <button class="nav-btn active">提号系统</button>
          <a href="./index.html#support" class="nav-btn">接码验证</a>
          <a href="./stock.html" class="nav-btn">库存监控</a>
          <a href="./subscription.html" class="nav-btn">订阅状态</a>
        </nav>
      </header>

      <section class="quota-panel stock-banner">
        <div class="section-heading centered">
          <p class="eyebrow">实时额度</p>
          <h2 id="stock-status-value">加载中...</h2>
          <p class="panel-desc" id="stock-status-desc">正在获取后台可分配额度</p>
        </div>
        <div class="stock-meta">
          <span>后台可分配额度：<strong id="stock-claimed-value">-</strong></span>
          <span>刷新时间：<strong id="stock-cached-at">-</strong></span>
        </div>
      </section>

      <!-- Verify Section -->
      <section id="verify-section" class="quota-panel">
        <div class="section-heading centered">
          <p class="eyebrow">提号系统</p>
          <h2>验证卡密</h2>
          <p class="panel-desc">输入您的卡密编码，验证后即可进行提号操作。</p>
        </div>
        <form id="verify-form" class="stack">
          <div class="field">
            <input id="card-code-input" name="cardCode" placeholder="请输入卡密编码" autocomplete="off" />
          </div>
          <button type="submit" id="verify-btn" class="primary-btn">验证卡密</button>
        </form>
        <div id="verify-result" class="result muted">请输入卡密并点击验证。</div>
      </section>

      <!-- Quota Info + Claim Section (hidden until verified) -->
      <section id="claim-section" class="hidden">
        <!-- Quota Stats -->
        <div class="quota-panel">
          <div class="quota-stats">
            <div class="quota-stat-card">
              <div class="label">剩余可提</div>
              <div class="value" id="remaining-value">-</div>
            </div>
          </div>

          <!-- Status Messages -->
          <div id="status-exhausted" class="status-message exhausted hidden">已提完</div>

          <!-- Warning Display -->
          <div id="warning-box" class="warning-box">
            <div class="warning-title" id="warning-title"></div>
            <div class="warning-message" id="warning-message"></div>
          </div>

          <!-- Claim Form -->
          <div id="claim-area">
            <div class="claim-form">
              <div class="claim-fields">
                <label class="field">
                  <span class="field-label">每次提取数量</span>
                  <input type="number" id="claim-batch-count" min="1" value="1" placeholder="每次提取数量" />
                </label>
                <label class="field">
                  <span class="field-label">目标提取总量</span>
                  <input type="number" id="claim-count" min="1" placeholder="提取总数量" />
                </label>
              </div>
              <div class="claim-actions">
                <button type="button" id="auto-claim-btn" class="primary-btn">自动提取</button>
              </div>
            </div>
            <div id="auto-claim-status" class="result muted auto-claim-status hidden"></div>
          </div>

          <!-- Claim Result -->
          <div id="claim-result" class="result muted hidden"></div>
        </div>

        <!-- Accounts Display -->
        <div id="accounts-panel" class="accounts-panel">
          <div class="quota-panel">
            <div class="accounts-title">提取成功 - 账号列表</div>
            <div id="accounts-list"></div>
          </div>
        </div>

        <!-- History Section -->
        <div class="quota-panel" id="history-panel">
          <div class="history-header">
            <h3 class="history-title">提取历史</h3>
            <div class="history-actions">
              <button type="button" class="ghost-btn history-btn" id="refresh-history-btn">刷新历史</button>
              <button type="button" class="ghost-btn history-btn" id="download-history-btn">下载记录</button>
            </div>
          </div>
          <div id="history-list">
            <div class="history-empty" id="history-empty">暂无提取记录</div>
          </div>
        </div>
      </section>
    </main>

    <script src="./runtime-config.js"></script>
    <script>
      const API_BASE = (globalThis.KAWANG_CONFIG?.apiUrl || "http://127.0.0.1:4300").replace(/\/+$/, "");

      // --- State ---
      let verifiedCardCode = null;
      let warningAckId = "";
      let warningPollTimer = null;
      let stockStatusTimer = null;
      let autoClaimTimer = null;
      let autoClaimQueueTimer = null;
      let autoClaimRunning = false;
      let autoClaimInFlight = false;
      let autoClaimTargetTotal = 0;
      let autoClaimClaimedTotal = 0;
      let autoClaimSessionId = "";
      let autoClaimQueued = false;

      // --- DOM ---
      const stockStatusValue = document.getElementById("stock-status-value");
      const stockStatusDesc = document.getElementById("stock-status-desc");
      const stockWindowValue = document.getElementById("stock-window-value");
      const stockClaimedValue = document.getElementById("stock-claimed-value");
      const stockCachedAt = document.getElementById("stock-cached-at");
      const verifyForm = document.getElementById("verify-form");
      const cardCodeInput = document.getElementById("card-code-input");
      const verifyBtn = document.getElementById("verify-btn");
      const verifyResult = document.getElementById("verify-result");
      const verifySection = document.getElementById("verify-section");
      const claimSection = document.getElementById("claim-section");
      const remainingValue = document.getElementById("remaining-value");
      const statusExhausted = document.getElementById("status-exhausted");
      const warningBox = document.getElementById("warning-box");
      const warningTitle = document.getElementById("warning-title");
      const warningMessage = document.getElementById("warning-message");
      const claimBatchCount = document.getElementById("claim-batch-count");
      const claimCount = document.getElementById("claim-count");
      const autoClaimBtn = document.getElementById("auto-claim-btn");
      const autoClaimStatus = document.getElementById("auto-claim-status");
      const claimResult = document.getElementById("claim-result");
      const accountsPanel = document.getElementById("accounts-panel");
      const accountsList = document.getElementById("accounts-list");

      // --- Utilities ---
      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#39;");
      }

      function setState(el, message, type) {
        el.className = `result ${type}`;
        el.textContent = message;
        el.classList.remove("hidden");
      }

      function getNumericValue(input) {
        return Number.parseInt(input.value, 10);
      }

      function getRemainingQuotaValue() {
        const match = remainingValue.textContent.match(/\d+/);
        return match ? Number.parseInt(match[0], 10) : null;
      }

      function getAvailableStockValue() {
        const availableText = stockStatusValue.textContent.trim();
        if (!availableText || availableText === "加载中..." || availableText === "未知") {
          return null;
        }
        if (availableText.includes("无") || availableText.includes("售罄") || availableText.includes("0")) {
          return 0;
        }
        return 1;
      }

      function formatDateTime(value) {
        if (!value) return "-";
        try {
          return new Date(value).toLocaleString("zh-CN", {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          });
        } catch {
          return value;
        }
      }

      function updateAutoClaimStatus(message, type = "muted") {
        setState(autoClaimStatus, message, type);
      }

      function syncClaimControls() {
        const remainingQuota = getRemainingQuotaValue();
        const quotaDepleted = remainingQuota !== null && remainingQuota <= 0;
        claimBatchCount.disabled = autoClaimRunning || quotaDepleted;
        claimCount.disabled = autoClaimRunning || quotaDepleted;
        autoClaimBtn.textContent = autoClaimRunning ? "停止自动提取" : "自动提取";
        autoClaimBtn.disabled = quotaDepleted;
      }

      async function releaseAutoClaimSession() {
        if (!autoClaimSessionId) return;
        const sessionId = autoClaimSessionId;
        autoClaimSessionId = "";
        try {
          await apiRequest(`/api/public/quota/auto-claim/session/${encodeURIComponent(sessionId)}`, {
            method: "DELETE"
          });
        } catch {
          // 会话会在后端自动过期，这里忽略释放失败。
        }
      }

      function clearAutoClaimTimers() {
        if (autoClaimTimer) {
          clearInterval(autoClaimTimer);
          autoClaimTimer = null;
        }
        if (autoClaimQueueTimer) {
          clearInterval(autoClaimQueueTimer);
          autoClaimQueueTimer = null;
        }
      }

      function stopAutoClaim(reason, type = "muted", options = {}) {
        clearAutoClaimTimers();
        autoClaimRunning = false;
        autoClaimInFlight = false;
        autoClaimQueued = false;
        if (options.releaseSession !== false) {
          releaseAutoClaimSession();
        }
        if (reason) {
          updateAutoClaimStatus(reason, type);
        }
        syncClaimControls();
      }

      async function refreshStockStatus() {
        try {
          const status = await apiRequest("/api/public/quota/status");
          stockStatusValue.textContent = status.available || "未知";
          stockStatusDesc.textContent = "根据后台已保存 API 密钥的可分配额度显示";
          stockWindowValue.textContent = "-";
          stockClaimedValue.textContent = status.availableQuota ?? 0;
          stockCachedAt.textContent = formatDateTime(status.cachedAt);
          syncClaimControls();
        } catch {
          stockStatusValue.textContent = "未知";
          stockStatusDesc.textContent = "额度状态获取失败，5 秒后自动重试";
          stockWindowValue.textContent = "-";
          stockClaimedValue.textContent = "-";
          stockCachedAt.textContent = "-";
        }
      }

      function startStockStatusPolling() {
        refreshStockStatus();
        stockStatusTimer = setInterval(refreshStockStatus, 5000);
      }

      function stopStockStatusPolling() {
        if (stockStatusTimer) {
          clearInterval(stockStatusTimer);
          stockStatusTimer = null;
        }
      }

      // --- API Helpers ---
      async function apiRequest(path, options = {}) {
        const { headers = {}, ...rest } = options;
        const response = await fetch(`${API_BASE}${path}`, {
          headers: { "Content-Type": "application/json", ...headers },
          ...rest
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.message || "请求失败");
        }
        return payload;
      }

      // --- Verify ---
      verifyForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const code = cardCodeInput.value.trim();
        if (!code) {
          setState(verifyResult, "请输入卡密编码", "error");
          return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = "验证中...";
        setState(verifyResult, "正在验证卡密...", "muted");

        try {
          const result = await apiRequest("/api/public/quota/verify", {
            method: "POST",
            body: JSON.stringify({ cardCode: code })
          });

          if (result.valid) {
            verifiedCardCode = code;
            setState(verifyResult, "验证成功", "success");
            showClaimSection();
          }
        } catch (error) {
          setState(verifyResult, error.message, "error");
        } finally {
          verifyBtn.disabled = false;
          verifyBtn.textContent = "验证卡密";
        }
      });

      startStockStatusPolling();

      // --- Show Claim Section ---
      async function showClaimSection() {
        claimSection.classList.remove("hidden");
        await refreshQuotaInfo();
        startWarningPolling();
        await loadHistory();
      }

      // --- Refresh Quota Info ---
      async function refreshQuotaInfo() {
        if (!verifiedCardCode) return;

        try {
          const info = await apiRequest(`/api/public/quota/info?cardCode=${encodeURIComponent(verifiedCardCode)}`);
          const remaining = info.remaining;

          remainingValue.textContent = `${remaining} 货`;

          // Handle exhausted state
          if (remaining <= 0) {
            remainingValue.classList.add("exhausted");
            statusExhausted.classList.remove("hidden");
            if (autoClaimRunning) {
              stopAutoClaim("自动提取已停止：卡密额度已用完", "error");
            }
          } else {
            remainingValue.classList.remove("exhausted");
            statusExhausted.classList.add("hidden");
          }

          syncClaimControls();
        } catch (error) {
          setState(claimResult, error.message, "error");
        }
      }

      // --- Warning Polling ---
      function startWarningPolling() {
        pollWarning();
        warningPollTimer = setInterval(pollWarning, 5000);
      }

      function stopWarningPolling() {
        if (warningPollTimer) {
          clearInterval(warningPollTimer);
          warningPollTimer = null;
        }
      }

      async function pollWarning() {
        try {
          const data = await apiRequest("/api/public/quota/claim-warning");
          if (data.warning && data.warning.id) {
            warningAckId = data.warning.id;
            warningTitle.textContent = data.warning.title || "";
            warningMessage.textContent = data.warning.message || "";
            warningBox.classList.add("visible");
          } else {
            warningAckId = "";
            warningBox.classList.remove("visible");
          }
        } catch {
          // Silently ignore warning poll errors
        }
      }

      // --- Claim ---
      async function performClaim(count, options = {}) {
        const { isAuto = false } = options;
        if (!verifiedCardCode) {
          throw new Error("请先验证卡密");
        }

        accountsPanel.classList.remove("visible");
        setState(claimResult, isAuto ? `自动提取中，正在尝试提取 ${count} 货...` : "正在提取...", "muted");

        const result = await apiRequest("/api/public/quota/claim", {
          method: "POST",
          body: JSON.stringify({
            cardCode: verifiedCardCode,
            count,
            warningAckId: warningAckId || "",
            autoSessionId: autoClaimSessionId || ""
          })
        });

        if (result.queued) {
          const positionText = result.queue?.position ? `当前排队第 ${result.queue.position} 位` : "正在等待可用名额";
          updateAutoClaimStatus(`自动提取排队中：${positionText}`, "muted");
          return result;
        }

        if (result.success) {
          setState(claimResult, `提取成功，消耗 ${result.chargedQuota} 货，剩余 ${result.remaining} 货`, "success");
          renderAccounts(result.accounts || []);
          await refreshQuotaInfo();
          await loadHistory();
        }

        return result;
      }

      function getNextAutoClaimCount() {
        const batchCount = getNumericValue(claimBatchCount);
        const targetCount = getNumericValue(claimCount);
        if (!batchCount || batchCount < 1) {
          throw new Error("请输入有效的每次提取数量");
        }
        if (!targetCount || targetCount < 1) {
          throw new Error("请输入有效的目标提取总量");
        }
        const remainingTarget = autoClaimTargetTotal - autoClaimClaimedTotal;
        return Math.min(batchCount, remainingTarget);
      }

      async function runAutoClaimAttempt() {
        if (!autoClaimRunning || autoClaimQueued || autoClaimInFlight) return;
        if (autoClaimClaimedTotal >= autoClaimTargetTotal) {
          stopAutoClaim(`自动提取已完成：已累计提取 ${autoClaimClaimedTotal}/${autoClaimTargetTotal} 货`, "success");
          return;
        }

        const remainingQuota = getRemainingQuotaValue();
        if (remainingQuota !== null && remainingQuota <= 0) {
          stopAutoClaim("自动提取已停止：卡密额度已用完", "error");
          return;
        }

        let nextCount;
        try {
          nextCount = getNextAutoClaimCount();
        } catch (error) {
          stopAutoClaim(error.message, "error");
          return;
        }

        autoClaimInFlight = true;
        updateAutoClaimStatus(`自动提取进行中：已累计 ${autoClaimClaimedTotal}/${autoClaimTargetTotal} 货，正在尝试 ${nextCount} 货`, "muted");

        try {
          const result = await performClaim(nextCount, { isAuto: true });
          if (result?.queued) {
            autoClaimQueued = true;
            startAutoClaimQueuePolling();
            return;
          }
          const chargedQuota = Number(result?.chargedQuota) || nextCount;
          autoClaimClaimedTotal += chargedQuota;
          if (autoClaimClaimedTotal >= autoClaimTargetTotal) {
            stopAutoClaim(`自动提取已完成：已累计提取 ${autoClaimClaimedTotal}/${autoClaimTargetTotal} 货`, "success");
          } else {
            updateAutoClaimStatus(`自动提取进行中：已累计 ${autoClaimClaimedTotal}/${autoClaimTargetTotal} 货，10 秒后继续`, "success");
          }
        } catch (error) {
          setState(claimResult, error.message, "error");
          updateAutoClaimStatus(`自动提取遇到错误：${error.message}，10 秒后继续重试`, "error");
        } finally {
          autoClaimInFlight = false;
        }
      }

      async function createAutoClaimSession() {
        const session = await apiRequest("/api/public/quota/auto-claim/session", {
          method: "POST",
          body: JSON.stringify({ cardCode: verifiedCardCode })
        });
        autoClaimSessionId = session.sessionId || "";
        autoClaimQueued = session.status === "queued";
        return session;
      }

      async function pollAutoClaimQueue() {
        if (!autoClaimRunning || !autoClaimSessionId) return;
        try {
          const session = await apiRequest(`/api/public/quota/auto-claim/session/${encodeURIComponent(autoClaimSessionId)}`);
          autoClaimQueued = session.status === "queued";
          if (session.status === "active") {
            if (autoClaimQueueTimer) {
              clearInterval(autoClaimQueueTimer);
              autoClaimQueueTimer = null;
            }
            updateAutoClaimStatus(`已进入自动提取阶段：已累计 ${autoClaimClaimedTotal}/${autoClaimTargetTotal} 货`, "success");
            runAutoClaimAttempt();
            if (!autoClaimTimer) {
              autoClaimTimer = setInterval(runAutoClaimAttempt, 10000);
            }
            return;
          }
          const positionText = session.position ? `当前排队第 ${session.position} 位` : "正在等待可用名额";
          updateAutoClaimStatus(`自动提取排队中：${positionText}，最多同时 ${session.maxActive || 3} 人`, "muted");
        } catch (error) {
          stopAutoClaim(error.message, "error", { releaseSession: false });
        }
      }

      function startAutoClaimQueuePolling() {
        if (autoClaimQueueTimer) return;
        pollAutoClaimQueue();
        autoClaimQueueTimer = setInterval(pollAutoClaimQueue, 3000);
      }

      async function startAutoClaim() {
        if (autoClaimRunning) {
          stopAutoClaim(`自动提取已手动停止：已累计提取 ${autoClaimClaimedTotal}/${autoClaimTargetTotal} 货`, "muted");
          return;
        }

        if (!verifiedCardCode) {
          setState(claimResult, "请先验证卡密", "error");
          return;
        }

        const batchCount = getNumericValue(claimBatchCount);
        const targetCount = getNumericValue(claimCount);
        if (!batchCount || batchCount < 1) {
          setState(claimResult, "请输入有效的每次提取数量", "error");
          return;
        }
        if (!targetCount || targetCount < 1) {
          setState(claimResult, "请输入有效的目标提取总量", "error");
          return;
        }

        autoClaimTargetTotal = targetCount;
        autoClaimClaimedTotal = 0;
        autoClaimRunning = true;
        autoClaimInFlight = false;
        autoClaimQueued = false;
        autoClaimSessionId = "";
        updateAutoClaimStatus(`自动提取已启动：目标 ${autoClaimTargetTotal} 货，每次 ${batchCount} 货，正在申请队列名额`, "muted");
        syncClaimControls();
        try {
          const session = await createAutoClaimSession();
          if (session.status === "queued") {
            const positionText = session.position ? `当前排队第 ${session.position} 位` : "正在等待可用名额";
            updateAutoClaimStatus(`自动提取排队中：${positionText}，最多同时 ${session.maxActive || 3} 人`, "muted");
            startAutoClaimQueuePolling();
            return;
          }
          updateAutoClaimStatus(`已进入自动提取阶段：目标 ${autoClaimTargetTotal} 货，每次 ${batchCount} 货`, "muted");
          runAutoClaimAttempt();
          autoClaimTimer = setInterval(runAutoClaimAttempt, 10000);
        } catch (error) {
          stopAutoClaim(error.message, "error", { releaseSession: false });
        }
      }

      autoClaimBtn.addEventListener("click", () => {
        startAutoClaim();
      });

      window.addEventListener("beforeunload", () => {
        if (!autoClaimSessionId) return;
        const url = `${API_BASE}/api/public/quota/auto-claim/session/${encodeURIComponent(autoClaimSessionId)}`;
        fetch(url, { method: "DELETE", keepalive: true }).catch(() => {});
      });

      // --- Render Accounts ---
      function renderAccounts(accounts) {
        if (!accounts.length) {
          accountsPanel.classList.remove("visible");
          return;
        }

        accountsPanel.classList.add("visible");
        accountsList.innerHTML = accounts.map((account, index) => `
          <div class="account-row">
            <span class="account-text">${escapeHtml(account)}</span>
            <button class="copy-btn" data-account="${escapeHtml(account)}" onclick="copyAccount(this)">复制</button>
          </div>
        `).join("");
      }

      // --- Copy Account ---
      function copyAccount(btn) {
        const text = btn.getAttribute("data-account");
        navigator.clipboard.writeText(text).then(() => {
          btn.textContent = "已复制";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "复制";
            btn.classList.remove("copied");
          }, 2000);
        }).catch(() => {
          // Fallback for older browsers
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
          btn.textContent = "已复制";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "复制";
            btn.classList.remove("copied");
          }, 2000);
        });
      }

      // Make copyAccount available globally for onclick handler
      window.copyAccount = copyAccount;

      // --- History ---
      const historyList = document.getElementById("history-list");
      const historyEmpty = document.getElementById("history-empty");
      const refreshHistoryBtn = document.getElementById("refresh-history-btn");
      const downloadHistoryBtn = document.getElementById("download-history-btn");

      async function loadHistory() {
        if (!verifiedCardCode) return;

        try {
          const data = await apiRequest(`/api/public/quota/history?cardCode=${encodeURIComponent(verifiedCardCode)}`);
          const history = data.history || [];

          if (history.length === 0) {
            historyList.innerHTML = '<div class="history-empty">暂无提取记录</div>';
            return;
          }

          historyList.innerHTML = history.map(record => {
            const time = formatTime(record.createdAt);
            const amount = record.amount ?? 0;
            const accountCount = record.accountCount ?? 0;
            const accounts = record.accounts || [];
            const accountsHtml = accounts.length
              ? `<div class="history-record-accounts">${accounts.map(a => `<code class="history-account-item">${escapeHtml(a)}</code>`).join("")}</div>`
              : "";
            return `
              <div class="history-record" style="grid-template-columns:1fr;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                  <span class="history-time">${escapeHtml(time)}</span>
                  <span class="history-amount">${escapeHtml(amount)} 货</span>
                  <span class="history-accounts">${escapeHtml(accountCount)} 个账号</span>
                </div>
                ${accountsHtml}
              </div>
            `;
          }).join("");
        } catch (error) {
          historyList.innerHTML = '<div class="history-empty">暂无提取记录</div>';
        }
      }

      function formatTime(isoString) {
        if (!isoString) return "-";
        try {
          const date = new Date(isoString);
          return date.toLocaleString("zh-CN", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          });
        } catch {
          return isoString;
        }
      }

      function downloadHistory() {
        if (!verifiedCardCode) return;
        const url = `${API_BASE}/api/public/quota/history/download?cardCode=${encodeURIComponent(verifiedCardCode)}`;
        window.open(url, "_blank");
      }

      refreshHistoryBtn.addEventListener("click", () => {
        loadHistory();
      });

      downloadHistoryBtn.addEventListener("click", () => {
        downloadHistory();
      });

      window.addEventListener("beforeunload", () => {
        stopWarningPolling();
        stopStockStatusPolling();
        stopAutoClaim();
      });
    </script>
  </body>
</html>
