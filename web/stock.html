<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaWang Stock Monitor - 库存监控</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
      /* 监控面板专用额外样式 */
      .monitoring-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        gap: 16px;
        flex-wrap: wrap;
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .control-select {
        background: rgba(94, 120, 200, 0.08);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 14px;
        outline: none;
        cursor: pointer;
      }

      .control-select:focus {
        border-color: var(--primary);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 32px;
      }

      .stat-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 24px;
        backdrop-filter: blur(12px);
      }

      .stat-value {
        font-size: 32px;
        font-weight: 800;
        margin-top: 8px;
        background: linear-gradient(135deg, #fff, #b2c5ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .monitoring-table-container {
        overflow-x: auto;
        margin-top: 24px;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
      }

      th {
        text-align: left;
        padding: 12px 16px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      td {
        padding: 16px;
        background: rgba(255, 255, 255, 0.02);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      td:first-child {
        border-left: 1px solid var(--line);
        border-top-left-radius: 16px;
        border-bottom-left-radius: 16px;
      }

      td:last-child {
        border-right: 1px solid var(--line);
        border-top-right-radius: 16px;
        border-bottom-right-radius: 16px;
      }

      .stock-pill {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
      }

      .stock-ok { background: rgba(67, 213, 159, 0.15); color: var(--success); }
      .stock-low { background: rgba(255, 213, 138, 0.15); color: #ffd58a; }
      .stock-out { background: rgba(255, 127, 159, 0.15); color: var(--error); }

      .sparkline-container {
        width: 140px;
        height: 40px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
      }

      .dot-success { background: var(--success); box-shadow: 0 0 8px var(--success); }

      .product-name {
        font-weight: 700;
        color: var(--text);
        text-decoration: none;
      }

      .product-name:hover {
        color: var(--primary);
      }

      .source-link {
        color: var(--primary);
        font-size: 13px;
        text-decoration: none;
        font-weight: 600;
      }

      .source-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 768px) {
        .monitoring-controls { flex-direction: column; align-items: stretch; }
        .sparkline-container { width: 100px; }
      }

      @media (max-width: 600px) {
        th:nth-child(4), td:nth-child(4), /* 隐藏更新时间 */
        th:nth-child(5), td:nth-child(5) { display: none; } /* 隐藏来源 ID 列 */
        .summary-grid { grid-template-columns: 1fr; }
        .page { padding: 20px 12px; }
        .pane-content { padding: 20px; }
        .stat-card { padding: 16px; }
        .stat-value { font-size: 24px; }
        td { padding: 12px 8px; }
        .product-name { font-size: 14px; display: block; word-break: break-word; }
        .sparkline-container { width: 70px; }
        .stock-pill { padding: 2px 8px; font-size: 12px; }
        .monitoring-controls { flex-direction: column; align-items: stretch; gap: 12px; }
        .control-group { flex-direction: column; align-items: flex-start; gap: 8px; }
        .control-item { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .control-select { width: 120px; }
      }
    </style>
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-grid"></div>

    <main class="page">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">K</span>
          <span class="brand-copy">
            <strong>KaWang</strong>
            <small>Stock Monitor</small>
          </span>
        </a>
        <nav class="topnav">
          <a href="./index.html" class="nav-btn">兑换中心</a>
          <button class="nav-btn active">库存监控</button>
        </nav>
      </header>

      <!-- Controls Section -->
      <section class="monitoring-controls">
        <div class="control-group">
          <div class="control-item">
            <span class="eyebrow">趋势范围</span>
            <select id="daysSelect" class="control-select">
              <option value="1">近 1 天</option>
              <option value="3">近 3 天</option>
              <option value="7">近 7 天</option>
            </select>
          </div>
          <div class="control-item">
            <span class="eyebrow">自动刷新</span>
            <select id="autoRefreshSelect" class="control-select">
              <option value="off">关闭</option>
              <option value="60">每分钟</option>
            </select>
          </div>
        </div>
        <button id="refreshBtn" class="primary-btn" style="padding: 10px 24px;">立即刷新</button>
      </section>

      <!-- Summary Section -->
      <section class="summary-grid">
        <div class="stat-card">
          <div class="eyebrow">API 状态</div>
          <div id="apiStatus" class="stat-value" style="font-size: 24px;">
            <span class="status-dot dot-success"></span>连接中...
          </div>
        </div>
        <div class="stat-card">
          <div class="eyebrow">低库存项目</div>
          <div id="lowStockCount" class="stat-value">-</div>
        </div>
        <div class="stat-card">
          <div class="eyebrow">最后同步</div>
          <div id="lastSyncTime" class="stat-value" style="font-size: 18px; margin-top: 16px; color: var(--muted); -webkit-text-fill-color: var(--muted);">--:--:--</div>
        </div>
      </section>

      <!-- Stock Table Section -->
      <section class="panel">
        <div class="section-heading">
          <p class="eyebrow">Inventory</p>
          <h2>商品库存明细</h2>
          <p class="panel-desc">实时监控各激活通道与商品的库存余量及历史趋势。</p>
        </div>

        <div class="monitoring-table-container">
          <table>
            <thead>
              <tr>
                <th>商品名称</th>
                <th>当前库存</th>
                <th>库存趋势</th>
                <th>更新时间</th>
                <th>来源</th>
              </tr>
            </thead>
            <tbody id="stock-list">
              <tr><td colspan="5" style="text-align:center; color: var(--muted);">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./runtime-config.js"></script>
    <script>
      const API_BASE = (globalThis.KAWANG_CONFIG?.apiUrl || "").replace(/\/+$/, "");
      const LS_DAYS_KEY = "kw_stock_days";
      const LS_AR_KEY = "kw_stock_auto_refresh";

      const els = {
        stockList: document.getElementById("stock-list"),
        apiStatus: document.getElementById("apiStatus"),
        lowStockCount: document.getElementById("lowStockCount"),
        lastSyncTime: document.getElementById("lastSyncTime"),
        daysSelect: document.getElementById("daysSelect"),
        autoRefreshSelect: document.getElementById("autoRefreshSelect"),
        refreshBtn: document.getElementById("refreshBtn")
      };

      const STATUS_RANK = { out: 0, low: 1, general: 2, sufficient: 3, good: 3 };

      const AI987_LEVEL_MAP = {
        none: { status: "out",  statusLabel: "缺货" },
        low:  { status: "low",  statusLabel: "偏低" },
        high: { status: "good", statusLabel: "充足" }
      };

      let autoRefreshTimer = null;
      let currentProducts = [];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatTime(iso) {
        if (!iso) return "-";
        try {
          const d = new Date(iso);
          if (Number.isNaN(d.getTime())) return iso;
          return new Intl.DateTimeFormat("zh-CN", {
            timeZone: "Asia/Shanghai",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }).format(d);
        } catch {
          return "-";
        }
      }

      function pillClass(status) {
        const s = String(status || "").toLowerCase();
        if (s === "out") return "stock-out";
        if (s === "low" || s === "general") return "stock-low";
        return "stock-ok";
      }

      async function fetchJson(path) {
        const response = await fetch(`${API_BASE}${path}`, {
          headers: { Accept: "application/json" },
          cache: "no-store"
        });
        const payload = await response.json();
        if (!response.ok || payload.ok === false) {
          throw new Error(payload.error || payload.message || "接口异常");
        }
        return payload;
      }

      function renderApiOk(fetchedAt) {
        els.apiStatus.innerHTML =
          '<span class="status-dot dot-success"></span>正常';
        els.lastSyncTime.textContent = formatTime(fetchedAt) || new Date().toLocaleTimeString("zh-CN", { hour12: false });
      }

      function renderApiError(error) {
        els.apiStatus.innerHTML =
          '<span class="status-dot" style="background:var(--error);box-shadow:0 0 8px var(--error)"></span>异常';
        els.stockList.innerHTML =
          `<tr><td colspan="5" style="text-align:center;color:var(--error);">${escapeHtml(error.message || "请求失败")}</td></tr>`;
      }

      function renderProducts(products) {
        const sorted = [...products].sort(
          (a, b) => (STATUS_RANK[a.status] ?? 9) - (STATUS_RANK[b.status] ?? 9)
        );

        const lowCount = sorted.filter(
          (p) => p.status === "low" || p.status === "out"
        ).length;
        els.lowStockCount.textContent = lowCount;

        if (!sorted.length) {
          els.stockList.innerHTML =
            '<tr><td colspan="5" style="text-align:center;color:var(--muted);">暂无产品数据</td></tr>';
          return;
        }

        els.stockList.innerHTML = sorted
          .map((p) => {
            const label = escapeHtml(p.statusLabel || p.status || "未知");
            const cls = pillClass(p.status);
            const name = escapeHtml(p.name || p.id || "未命名");
            const note = p.note ? escapeHtml(p.note) : "";
            const time = formatTime(p.updatedAt);
            const safeId = escapeHtml(p.id || "");

            const isOut = p.status === "out";
            const isAi987 = String(p.id || "").startsWith("987ai-");
            const trendContent = isOut && note
              ? `<div style="font-size:12px;color:#ffd58a;line-height:1.2;max-width:140px;">${note}</div>`
              : isAi987
                ? `<div style="font-size:12px;color:var(--muted);">无历史</div>`
                : `<div class="sparkline-container"><canvas id="spark-${safeId}"></canvas></div>`;

            return `<tr>
              <td>
                <span class="product-name">${name}</span>
                ${note && !isOut ? `<br><span style="font-size:12px;color:var(--muted);">${note}</span>` : ""}
              </td>
              <td><span class="stock-pill ${cls}">${label}</span></td>
              <td>${trendContent}</td>
              <td style="color:var(--muted);font-size:13px;">${time}</td>
              <td><span style="font-size:12px;color:var(--muted);">${safeId}</span></td>
            </tr>`;
          })
          .join("");

        currentProducts = sorted;
      }

      async function loadCredentialStatus() {
        try {
          const payload = await fetchJson("/api/credential-status");
          renderApiOk(payload.fetched_at);
          return Array.isArray(payload.data?.products) ? payload.data.products : [];
        } catch (error) {
          renderApiError(error);
          return [];
        }
      }

      async function loadAi987Stock() {
        try {
          const payload = await fetchJson("/api/987ai-stock-info");
          const items = Array.isArray(payload.items) ? payload.items : [];
          const now = new Date().toISOString();
          return items.map((item) => {
            const mapped = AI987_LEVEL_MAP[String(item.level || "").toLowerCase()]
              || { status: "general", statusLabel: "未知" };
            const safeName = String(item.name || "unknown").replace(/[^A-Za-z0-9_-]/g, "_");
            return {
              id: `987ai-${safeName}`,
              name: `[987AI] ${item.name || "未命名"}`,
              status: mapped.status,
              statusLabel: mapped.statusLabel,
              updatedAt: now,
              note: ""
            };
          });
        } catch {
          return [];
        }
      }

      async function loadSparklines() {
        const days = els.daysSelect.value || "1";
        try {
          const payload = await fetchJson(`/api/stock-sparklines?days=${encodeURIComponent(days)}`);
          const series = payload.series || {};

          Object.entries(series).forEach(([productId, points]) => {
            const canvas = document.getElementById(`spark-${productId}`);
            if (!canvas) return;

            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();

            const labels = points.map((p) => p.ts_cst || p.ts);
            const stock = points.map((p) => p.stock);

            new Chart(canvas, {
              type: "line",
              data: {
                labels,
                datasets: [{
                  data: stock,
                  borderColor: "#71a7ff",
                  borderWidth: 2,
                  pointRadius: 0,
                  tension: 0.25,
                  fill: false
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: { x: { display: false }, y: { display: false } }
              }
            });
          });
        } catch {
          // sparklines 加载失败不阻塞主流程
        }
      }

      async function refreshAll() {
        els.refreshBtn.textContent = "刷新中...";
        els.refreshBtn.disabled = true;
        try {
          const [mainProducts, ai987Products] = await Promise.all([
            loadCredentialStatus(),
            loadAi987Stock()
          ]);
          const combined = [...mainProducts, ...ai987Products];
          if (combined.length) {
            renderProducts(combined);
          }
          await loadSparklines();
        } finally {
          els.refreshBtn.textContent = "立即刷新";
          els.refreshBtn.disabled = false;
        }
      }

      function restoreSettings() {
        const savedDays = localStorage.getItem(LS_DAYS_KEY);
        if (savedDays && ["1", "3", "7"].includes(savedDays)) {
          els.daysSelect.value = savedDays;
        }
        const savedAr = localStorage.getItem(LS_AR_KEY);
        if (savedAr && (savedAr === "off" || savedAr === "60")) {
          els.autoRefreshSelect.value = savedAr;
        }
      }

      function scheduleAutoRefresh() {
        if (autoRefreshTimer) {
          clearInterval(autoRefreshTimer);
          autoRefreshTimer = null;
        }
        const seconds = els.autoRefreshSelect.value;
        localStorage.setItem(LS_AR_KEY, seconds);
        if (seconds !== "off") {
          autoRefreshTimer = setInterval(refreshAll, Number(seconds) * 1000);
        }
      }

      els.daysSelect.addEventListener("change", () => {
        localStorage.setItem(LS_DAYS_KEY, els.daysSelect.value);
        loadSparklines();
      });

      els.autoRefreshSelect.addEventListener("change", scheduleAutoRefresh);

      els.refreshBtn.addEventListener("click", refreshAll);

      restoreSettings();
      refreshAll();
      scheduleAutoRefresh();
    </script>
  </body>
</html>
