<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>摇摇乐开箱</title>
    <link rel="stylesheet" href="./apple-design.css" />
    <style>
      :root {
        color-scheme: dark;
        --item-width: 180px;
        --item-gap: 14px;
        --common: #94a3b8;
        --rare: #38bdf8;
        --epic: #a855f7;
        --legendary: #f59e0b;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-blur: blur(20px);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 10% -5%, rgba(168, 85, 247, 0.18), transparent 36rem),
          radial-gradient(circle at 90% 15%, rgba(236, 72, 153, 0.14), transparent 32rem),
          radial-gradient(circle at 50% 105%, rgba(56, 189, 248, 0.14), transparent 38rem),
          rgba(15, 19, 36, 0.85);
        color: var(--text, #f3f5f9);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
      }

      body.embedded {
        background: transparent !important;
      }

      button { font: inherit; }
      button:disabled { cursor: not-allowed; opacity: 0.45; }

      .shell {
        width: min(1360px, calc(100vw - 36px));
        margin: 0 auto;
        padding: 20px 0 44px;
      }

      .topbar {
        min-height: 64px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: center;
        padding: 16px 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.3);
      }

      .brand { min-width: 0; }
      .brand-kicker {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--cyber-cyan, #38bdf8);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .brand-kicker::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cyber-cyan, #38bdf8);
        box-shadow: 0 0 8px var(--cyber-cyan, #38bdf8);
      }

      .brand h1 {
        margin: 4px 0 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: clamp(22px, 3.2vw, 32px);
        font-weight: 800;
        background: linear-gradient(135deg, #ffffff 30%, rgba(255, 255, 255, 0.75));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.15;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .icon-btn, .ghost-btn, .primary-btn {
        border-radius: 16px;
        min-height: 44px;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .icon-btn {
        width: 44px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        color: var(--text, #f3f5f9);
        display: grid;
        place-items: center;
        font-size: 17px;
        border-radius: 16px;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .icon-btn[aria-pressed="true"] {
        border-color: rgba(168, 85, 247, 0.7);
        background: rgba(168, 85, 247, 0.22);
        color: #c084fc;
        box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
      }

      .ghost-btn {
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 0 20px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text, #f3f5f9);
        border-radius: 16px;
      }

      .ghost-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .primary-btn {
        border: 0;
        padding: 0 32px;
        background: linear-gradient(135deg, #a855f7, #6366f1 50%, #ec4899);
        color: #ffffff;
        font-size: 15px;
        border-radius: 16px;
        box-shadow: 0 8px 25px -4px rgba(168, 85, 247, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      }

      .primary-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px -4px rgba(168, 85, 247, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      }

      .primary-btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .primary-btn.ready-pulse {
        animation: readyGlow 2s ease-in-out infinite alternate;
      }

      @keyframes readyGlow {
        0% { box-shadow: 0 8px 25px -4px rgba(168, 85, 247, 0.5), 0 0 0 0 rgba(168, 85, 247, 0.4); }
        100% { box-shadow: 0 12px 35px -2px rgba(236, 72, 153, 0.7), 0 0 0 8px rgba(168, 85, 247, 0); }
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin: 20px 0 0;
      }

      .metric {
        min-width: 0;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 18px 22px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .metric:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.22);
      }

      .metric span {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted, #8e9bb0);
        font-size: 13px;
        font-weight: 600;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 22px;
        font-weight: 800;
        color: var(--text, #f3f5f9);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .opening-stage {
        position: relative;
        margin: 24px 0 0;
        padding: 44px 24px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: grid;
        place-items: center;
        gap: 28px;
        overflow: hidden;
        box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.4);
      }

      .stage-label {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--cyber-cyan, #38bdf8);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .stage-label::before, .stage-label::after {
        width: 48px;
        height: 1px;
        content: "";
        background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
      }

      .case-window {
        position: relative;
        width: 100%;
        height: 236px;
        overflow: hidden;
        border-radius: 24px;
        border: 1px solid rgba(168, 85, 247, 0.35);
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow:
          inset 0 0 40px rgba(0, 0, 0, 0.4),
          0 0 35px rgba(168, 85, 247, 0.15);
      }

      .case-window::before, .case-window::after {
        position: absolute;
        z-index: 4;
        top: 0;
        bottom: 0;
        width: 22%;
        content: "";
        pointer-events: none;
      }

      .case-window::before { left: 0; background: linear-gradient(90deg, rgba(15, 19, 36, 0.92), transparent); }
      .case-window::after { right: 0; background: linear-gradient(270deg, rgba(15, 19, 36, 0.92), transparent); }

      #case-marker {
        position: absolute;
        z-index: 7;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #ec4899, #a855f7 50%, #38bdf8);
        box-shadow:
          0 0 15px rgba(168, 85, 247, 0.9),
          0 0 30px rgba(236, 72, 153, 0.6);
        pointer-events: none;
      }

      #case-marker::before, #case-marker::after {
        position: absolute;
        left: 50%;
        width: 0;
        height: 0;
        content: "";
        transform: translateX(-50%);
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.8));
      }

      #case-marker::before { top: 0; border-top: 13px solid #ec4899; }
      #case-marker::after { bottom: 0; border-bottom: 13px solid #38bdf8; }

      #case-track {
        display: flex;
        gap: var(--item-gap);
        width: max-content;
        height: 100%;
        align-items: center;
        padding-left: calc(50vw - var(--item-width) / 2);
        will-change: transform;
        transform: translate3d(0, 0, 0);
      }

      #case-track.spinning { transition: transform 5.4s cubic-bezier(0.12, 0.72, 0.1, 1); }

      .prize-item {
        position: relative;
        flex: 0 0 var(--item-width);
        width: var(--item-width);
        height: 184px;
        display: grid;
        grid-template-rows: 1fr auto;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid color-mix(in srgb, var(--rarity-color, var(--common)) 45%, rgba(255, 255, 255, 0.15));
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        padding: 16px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 
          0 8px 24px rgba(0, 0, 0, 0.25),
          inset 0 1px 1px rgba(255, 255, 255, 0.2);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .prize-item::before {
        position: absolute;
        inset: 0;
        content: "";
        background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--rarity-color) 30%, transparent), transparent 65%);
        pointer-events: none;
      }

      .prize-item[data-rarity="common"] { --rarity-color: var(--common); }
      .prize-item[data-rarity="rare"] { --rarity-color: var(--rare); }
      .prize-item[data-rarity="epic"] { --rarity-color: var(--epic); }
      .prize-item[data-rarity="legendary"] { --rarity-color: var(--legendary); }

      .prize-rarity-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        padding: 2px 8px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--rarity-color) 25%, rgba(0,0,0,0.4));
        border: 1px solid color-mix(in srgb, var(--rarity-color) 50%, transparent);
        color: var(--rarity-color);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .prize-icon {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        min-height: 98px;
        color: var(--rarity-color);
        font-size: 52px;
        font-weight: 900;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
      }

      .prize-icon img { width: 78px; height: 78px; object-fit: contain; }
      .prize-copy { position: relative; z-index: 1; min-width: 0; }
      .prize-copy strong { display: block; overflow: hidden; color: var(--text, #f3f5f9); font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .prize-copy span { display: block; margin-top: 4px; color: var(--rarity-color); font-size: 11px; font-weight: 800; text-transform: uppercase; }

      .opening-actions { min-height: 86px; display: grid; justify-items: center; gap: 12px; }
      .opening-actions .primary-btn { min-width: 220px; min-height: 52px; font-size: 16px; border-radius: 16px; }
      .opening-status { min-height: 20px; margin: 0; color: var(--muted, #8e9bb0); font-size: 14px; text-align: center; }
      .opening-status.error { color: #f43f5e; }
      .opening-status.success { color: #4ade80; }

      .result-reveal {
        min-height: 30px;
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        text-align: center;
      }

      .result-reveal[data-rarity="common"] { color: var(--common); }
      .result-reveal[data-rarity="rare"] { color: var(--rare); }
      .result-reveal[data-rarity="epic"] { color: var(--epic); }
      .result-reveal[data-rarity="legendary"] { color: var(--legendary); }

      .dashboard {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.9fr);
        gap: 24px;
        margin-top: 24px;
      }

      .section {
        min-width: 0;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 22px 24px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      .section-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 16px; }
      .section-head h2 { margin: 0; font-size: 17px; font-weight: 800; color: var(--text, #f3f5f9); }
      .section-head span { color: var(--muted, #8e9bb0); font-size: 13px; }

      .progress-list, #probability-list { display: grid; gap: 10px; }
      .progress-row, .probability-row {
        display: grid;
        grid-template-columns: minmax(110px, 1fr) minmax(130px, 1.6fr) auto;
        gap: 14px;
        align-items: center;
        min-height: 48px;
        padding: 8px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .progress-row strong, .probability-row strong { font-size: 13px; font-weight: 700; }
      .progress-bar { height: 7px; overflow: hidden; border-radius: 4px; background: rgba(255, 255, 255, 0.08); }
      .progress-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #a855f7, #38bdf8); }
      .progress-row span, .probability-row span { color: var(--muted, #8e9bb0); font-size: 12px; text-align: right; font-weight: 600; }

      .history {
        margin-top: 24px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 22px 24px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        overflow-x: auto;
      }

      table { width: 100%; min-width: 700px; border-collapse: separate; border-spacing: 0; }
      th, td { padding: 14px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
      th { color: var(--muted, #8e9bb0); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      td { color: var(--text, #f3f5f9); }
      .status { font-weight: 800; display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 8px; font-size: 12px; }
      .status-delivered { background: rgba(74, 222, 128, 0.18); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.35); }
      .status-delivery_failed { background: rgba(244, 63, 94, 0.18); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.35); }
      .status-selected { background: rgba(56, 189, 248, 0.18); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); }
      .status-voided { background: rgba(148, 163, 184, 0.18); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.35); }
      .retry-btn { min-height: 34px; padding: 0 14px; font-size: 12px; border-radius: 10px; }
      .empty { padding: 32px 0; color: var(--muted, #8e9bb0); text-align: center; font-size: 14px; }

      /* High-End Close-Up Spotlight Modal (特写动画) */
      .prize-modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .prize-modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .prize-modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(4, 6, 14, 0.82);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
      }

      .prize-modal-container {
        position: relative;
        z-index: 2;
        width: min(440px, calc(100vw - 32px));
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .light-ray-effect {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 560px;
        height: 560px;
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
        background: radial-gradient(circle, color-mix(in srgb, var(--modal-color, #a855f7) 38%, transparent) 0%, transparent 70%);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
      }

      .prize-modal-overlay.active .light-ray-effect {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.25) rotate(45deg);
        animation: rayRotate 20s linear infinite;
      }

      @keyframes rayRotate {
        from { transform: translate(-50%, -50%) scale(1.25) rotate(0deg); }
        to { transform: translate(-50%, -50%) scale(1.25) rotate(360deg); }
      }

      .prize-modal-card {
        position: relative;
        width: 100%;
        padding: 38px 28px 28px;
        background: rgba(18, 24, 43, 0.88);
        border: 1px solid color-mix(in srgb, var(--modal-color, #a855f7) 55%, rgba(255, 255, 255, 0.25));
        border-radius: 28px;
        box-shadow: 
          0 30px 90px -10px rgba(0, 0, 0, 0.75),
          0 0 55px color-mix(in srgb, var(--modal-color, #a855f7) 35%, transparent),
          inset 0 1px 1px rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        text-align: center;
        transform: scale(0.4) translateY(40px);
        opacity: 0;
        transition: transform 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
      }

      .prize-modal-overlay.active .prize-modal-card {
        transform: scale(1) translateY(0);
        opacity: 1;
      }

      .prize-modal-card[data-rarity="common"] { --modal-color: var(--common); }
      .prize-modal-card[data-rarity="rare"] { --modal-color: var(--rare); }
      .prize-modal-card[data-rarity="epic"] { --modal-color: var(--epic); }
      .prize-modal-card[data-rarity="legendary"] { --modal-color: var(--legendary); }

      .modal-rarity-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 18px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--modal-color) 22%, transparent);
        border: 1px solid color-mix(in srgb, var(--modal-color) 50%, transparent);
        color: var(--modal-color);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 20px;
        box-shadow: 0 0 18px color-mix(in srgb, var(--modal-color) 30%, transparent);
      }

      .modal-prize-icon-wrapper {
        position: relative;
        width: 110px;
        height: 110px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
      }

      .modal-prize-icon-glow {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--modal-color) 45%, transparent) 0%, transparent 70%);
        animation: pulseGlow 2.5s ease-in-out infinite alternate;
      }

      @keyframes pulseGlow {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 1; }
      }

      .modal-prize-icon {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        font-size: 56px;
        font-weight: 900;
        color: var(--modal-color);
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
      }

      .modal-prize-icon img {
        width: 86px;
        height: 86px;
        object-fit: contain;
        filter: drop-shadow(0 8px 18px color-mix(in srgb, var(--modal-color) 40%, transparent));
      }

      .modal-prize-title {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.5px;
      }

      .modal-prize-desc {
        margin: 0 0 20px;
        font-size: 14px;
        color: var(--muted, #8e9bb0);
        line-height: 1.5;
      }

      .modal-status-tag {
        display: inline-block;
        margin-bottom: 24px;
        padding: 5px 16px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 800;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted, #8e9bb0);
      }

      .modal-status-tag.success {
        background: rgba(74, 222, 128, 0.18);
        color: #4ade80;
        border: 1px solid rgba(74, 222, 128, 0.35);
      }

      .modal-status-tag.error {
        background: rgba(244, 63, 94, 0.18);
        color: #f43f5e;
        border: 1px solid rgba(244, 63, 94, 0.35);
      }

      .modal-claim-btn {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--modal-color), color-mix(in srgb, var(--modal-color) 70%, #ffffff));
        color: #070913;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 10px 28px -5px color-mix(in srgb, var(--modal-color) 50%, transparent);
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
      }

      .modal-claim-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 34px -5px color-mix(in srgb, var(--modal-color) 65%, transparent);
      }

      .modal-claim-btn:active {
        transform: translateY(1px);
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        .prize-modal-card { transform: none !important; }
        .light-ray-effect { display: none !important; }
      }

      @media (max-width: 820px) {
        :root { --item-width: 144px; --item-gap: 10px; }
        .shell { width: min(100% - 24px, 720px); padding-top: 14px; }
        .topbar { padding: 14px 18px; border-radius: 20px; }
        .brand h1 { font-size: 24px; }
        .summary { grid-template-columns: 1fr; gap: 10px; }
        .metric { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 16px; }
        .metric strong { margin: 0; font-size: 17px; }
        .opening-stage { padding: 32px 14px; border-radius: 22px; }
        .case-window { height: 204px; width: calc(100vw - 28px); border-radius: 20px; }
        .prize-item { height: 156px; padding: 12px; border-radius: 16px; }
        .prize-icon { min-height: 80px; font-size: 42px; }
        .prize-icon img { width: 64px; height: 64px; }
        .dashboard { grid-template-columns: 1fr; gap: 16px; }
        .section { padding: 18px 16px; border-radius: 20px; }
      }

      @media (max-width: 460px) {
        .toolbar .ghost-btn { display: none; }
        .progress-row, .probability-row { grid-template-columns: minmax(0, 1fr) auto; }
        .progress-bar { grid-row: 2; grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-kicker">Shake &amp; Win</div>
          <h1 id="campaign-name">摇摇乐开箱</h1>
        </div>
        <div class="toolbar">
          <button id="sound-toggle" class="icon-btn" type="button" aria-pressed="true" title="声音" aria-label="切换声音">♪</button>
          <button id="refresh-btn" class="ghost-btn" type="button">刷新</button>
        </div>
      </header>

      <section class="summary" aria-label="活动概要">
        <div class="metric"><span>🎫 可用摇摇卡</span><strong id="available-cards">0</strong></div>
        <div class="metric"><span>🎁 奖池奖品</span><strong id="prize-count">0</strong></div>
        <div class="metric"><span>⏳ 活动截止</span><strong id="campaign-end">-</strong></div>
      </section>

      <section class="opening-stage">
        <div class="stage-label">限定开箱</div>
        <div class="case-window" aria-live="off">
          <div id="case-marker" aria-hidden="true"></div>
          <div id="case-track"></div>
        </div>
        <div class="opening-actions">
          <button id="open-case-btn" class="primary-btn" type="button" disabled>开启 1 次</button>
          <p id="opening-status" class="opening-status">正在识别账号...</p>
          <p id="result-reveal" class="result-reveal"></p>
        </div>
      </section>

      <section class="dashboard">
        <div class="section">
          <div class="section-head"><h2>摇摇卡进度</h2><span id="progress-summary"></span></div>
          <div id="progress-list" class="progress-list"></div>
        </div>
        <div class="section">
          <div class="section-head"><h2>奖池概率</h2><span>库存不限</span></div>
          <div id="probability-list"></div>
        </div>
      </section>

      <section class="history">
        <div class="section-head"><h2>开箱记录</h2><span id="draw-count">0 条</span></div>
        <div id="history-list"></div>
      </section>
    </main>

    <!-- 抽中特写弹窗 (Spotlight Modal) -->
    <div id="prize-modal" class="prize-modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modal-prize-title">
      <div class="prize-modal-backdrop" id="modal-backdrop"></div>
      <div class="prize-modal-container">
        <div class="light-ray-effect"></div>
        <div class="prize-modal-card" id="modal-card" data-rarity="legendary">
          <div class="modal-rarity-badge" id="modal-rarity-badge">★ 传说级 奖品 ★</div>
          <div class="modal-prize-icon-wrapper">
            <div class="modal-prize-icon-glow"></div>
            <div class="modal-prize-icon" id="modal-prize-icon"></div>
          </div>
          <h2 class="modal-prize-title" id="modal-prize-title">奖品名称</h2>
          <p class="modal-prize-desc" id="modal-prize-desc">恭喜获得限定奖励</p>
          <div class="modal-status-tag success" id="modal-status-tag">已发放到账号</div>
          <button id="modal-claim-btn" class="modal-claim-btn" type="button">收 下 奖 励</button>
        </div>
      </div>
    </div>

    <script src="./runtime-config.js"></script>
    <script>
      const configuredApiBase = String(globalThis.KAWANG_CONFIG?.apiUrl || "").trim();
      const API_BASE = configuredApiBase ? configuredApiBase.replace(/\/+$/, "") : "";
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const refs = {
        campaignName: document.querySelector("#campaign-name"),
        availableCards: document.querySelector("#available-cards"),
        prizeCount: document.querySelector("#prize-count"),
        campaignEnd: document.querySelector("#campaign-end"),
        soundToggle: document.querySelector("#sound-toggle"),
        refreshBtn: document.querySelector("#refresh-btn"),
        caseTrack: document.querySelector("#case-track"),
        openCaseBtn: document.querySelector("#open-case-btn"),
        openingStatus: document.querySelector("#opening-status"),
        resultReveal: document.querySelector("#result-reveal"),
        progressSummary: document.querySelector("#progress-summary"),
        progressList: document.querySelector("#progress-list"),
        probabilityList: document.querySelector("#probability-list"),
        drawCount: document.querySelector("#draw-count"),
        historyList: document.querySelector("#history-list"),
        // Modal refs
        prizeModal: document.querySelector("#prize-modal"),
        modalBackdrop: document.querySelector("#modal-backdrop"),
        modalCard: document.querySelector("#modal-card"),
        modalRarityBadge: document.querySelector("#modal-rarity-badge"),
        modalPrizeIcon: document.querySelector("#modal-prize-icon"),
        modalPrizeTitle: document.querySelector("#modal-prize-title"),
        modalPrizeDesc: document.querySelector("#modal-prize-desc"),
        modalStatusTag: document.querySelector("#modal-status-tag"),
        modalClaimBtn: document.querySelector("#modal-claim-btn")
      };

      const state = {
        sessionToken: "",
        campaign: null,
        availableCards: 0,
        prizes: [],
        draws: [],
        spinning: false,
        soundEnabled: localStorage.getItem("shake_sound") !== "off",
        retryRequestId: ""
      };

      const SOURCE_LABELS = { subscription_purchase: "本站套餐购买", balance_consumption: "余额实际消耗" };
      const RARITY_LABELS = { common: "普通", rare: "稀有", epic: "史诗", legendary: "传说" };
      const STATUS_LABELS = { selected: "待发放", delivered: "已发放", delivery_failed: "发放失败", voided: "已作废" };

      function escapeHtml(value) {
        return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
      }

      function setStatus(message, type = "info") {
        refs.openingStatus.textContent = message || "";
        refs.openingStatus.className = `opening-status ${type === "info" ? "" : type}`;
      }

      function formatTime(value, dateOnly = false) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        return new Intl.DateTimeFormat("zh-CN", dateOnly
          ? { timeZone: "Asia/Shanghai", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }
          : { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }
        ).format(date);
      }

      function request(path, options = {}) {
        const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
        if (state.sessionToken) headers.Authorization = `Bearer ${state.sessionToken}`;
        return fetch(`${API_BASE}${path}`, { ...options, headers }).then(async (response) => {
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.message || "请求失败");
          return payload;
        }).catch((error) => {
          if (error.message !== "Failed to fetch") throw error;
          throw new Error("无法连接摇摇乐服务");
        });
      }

      function readAccessToken() {
        return localStorage.getItem("auth_token") || localStorage.getItem("access_token") || localStorage.getItem("token") || "";
      }

      function persistRefreshedAuth(payload) {
        const auth = payload?.refreshedAuth;
        if (!auth) return;
        if (auth.accessToken) localStorage.setItem("auth_token", auth.accessToken);
        if (auth.refreshToken) localStorage.setItem("refresh_token", auth.refreshToken);
      }

      function prizeIcon(prize) {
        const icon = String(prize.icon || "").trim();
        if (/^https?:\/\//i.test(icon)) return `<img src="${escapeHtml(icon)}" alt="" />`;
        if (icon) return escapeHtml(icon);
        if (prize.type === "balance") return "$";
        if (prize.type === "extra_draw") return "↻";
        return "◇";
      }

      function prizeItem(prize, target = false) {
        const rarityLabel = RARITY_LABELS[prize.rarity] || prize.rarity;
        return `<article class="prize-item" data-rarity="${escapeHtml(prize.rarity)}" ${target ? "data-target-prize" : ""}>
          <span class="prize-rarity-badge">${escapeHtml(rarityLabel)}</span>
          <div class="prize-icon">${prizeIcon(prize)}</div>
          <div class="prize-copy"><strong>${escapeHtml(prize.name)}</strong><span>${escapeHtml(rarityLabel)}</span></div>
        </article>`;
      }

      function buildIdleTrack() {
        const prizes = state.prizes.length ? state.prizes : [{ name: "等待奖池", type: "empty", rarity: "common" }];
        const items = Array.from({ length: 18 }, (_, index) => prizes[index % prizes.length]);
        refs.caseTrack.classList.remove("spinning");
        refs.caseTrack.style.transform = "translate3d(0, 0, 0)";
        refs.caseTrack.innerHTML = items.map((prize) => prizeItem(prize)).join("");
      }

      function renderProgress(progress) {
        refs.progressSummary.textContent = progress.length ? `${progress.length} 种来源` : "暂无规则";
        refs.progressList.innerHTML = progress.length ? progress.map((item) => {
          const ratio = Math.max(0, Math.min(100, Number(item.amount) / Number(item.threshold) * 100));
          return `<div class="progress-row">
            <strong>${escapeHtml(SOURCE_LABELS[item.source] || item.source)}</strong>
            <div class="progress-bar"><i style="width:${ratio}%"></i></div>
            <span>${escapeHtml(item.amount)} / ${escapeHtml(item.threshold)}</span>
          </div>`;
        }).join("") : `<div class="empty">暂无获取规则</div>`;
      }

      function renderProbabilities() {
        refs.probabilityList.innerHTML = state.prizes.length ? state.prizes.map((prize) => `
          <div class="probability-row">
            <strong>${escapeHtml(prize.name)}</strong>
            <div class="progress-bar"><i style="width:${Math.max(0, Math.min(100, Number(prize.probability)))}%;background:var(--${escapeHtml(prize.rarity)})"></i></div>
            <span>${escapeHtml(prize.probability)}%</span>
          </div>
        `).join("") : `<div class="empty">暂无奖品</div>`;
      }

      function renderHistory() {
        refs.drawCount.textContent = `${state.draws.length} 条`;
        if (!state.draws.length) {
          refs.historyList.innerHTML = `<div class="empty">暂无开箱记录</div>`;
          return;
        }
        refs.historyList.innerHTML = `<table><thead><tr><th>时间</th><th>奖品</th><th>稀有度</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.draws.map((draw) => `
          <tr>
            <td>${escapeHtml(formatTime(draw.createdAt))}</td>
            <td><strong>${escapeHtml(draw.prize.name)}</strong></td>
            <td>${escapeHtml(RARITY_LABELS[draw.prize.rarity] || draw.prize.rarity)}</td>
            <td><span class="status status-${escapeHtml(draw.status)}">${escapeHtml(STATUS_LABELS[draw.status] || draw.status)}</span></td>
            <td>${draw.status === "delivery_failed" ? `<button class="ghost-btn retry-btn" data-retry-request="${escapeHtml(draw.requestId)}">重试发放</button>` : "-"}</td>
          </tr>`).join("")}</tbody></table>`;
      }

      function render(payload) {
        persistRefreshedAuth(payload);
        if (payload.sessionToken) state.sessionToken = payload.sessionToken;
        state.campaign = payload.campaign || null;
        state.availableCards = Number(payload.availableCards || 0);
        state.prizes = payload.prizes || [];
        state.draws = payload.draws || [];
        refs.campaignName.textContent = state.campaign?.name || "摇摇乐开箱";
        document.title = state.campaign?.name || "摇摇乐开箱";
        refs.availableCards.textContent = state.availableCards;
        refs.prizeCount.textContent = state.prizes.length;
        refs.campaignEnd.textContent = state.campaign ? formatTime(state.campaign.endAt, true) : "暂无活动";
        updateButtonState();
        renderProgress(payload.progress || []);
        renderProbabilities();
        renderHistory();
        buildIdleTrack();
      }

      function updateButtonState() {
        const canOpen = state.sessionToken && state.campaign && state.availableCards >= 1 && !state.spinning;
        refs.openCaseBtn.disabled = !canOpen;
        if (canOpen) {
          refs.openCaseBtn.classList.add("ready-pulse");
        } else {
          refs.openCaseBtn.classList.remove("ready-pulse");
        }
      }

      function audioTick(frequency = 520, duration = 0.035) {
        if (!state.soundEnabled) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const context = audioTick.context || (audioTick.context = new AudioContextClass());
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(0.045, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + duration);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + duration);
      }

      function playVictoryChime(rarity = "common") {
        if (!state.soundEnabled) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const context = audioTick.context || (audioTick.context = new AudioContextClass());
        
        const frequencies = rarity === "legendary"
          ? [523.25, 659.25, 783.99, 1046.50, 1318.51]
          : rarity === "epic"
          ? [523.25, 659.25, 880.00]
          : [523.25, 659.25];

        frequencies.forEach((freq, index) => {
          const osc = context.createOscillator();
          const gain = context.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          const startTime = context.currentTime + index * 0.08;
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.08, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.35);
          osc.connect(gain).connect(context.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.35);
        });
      }

      function showPrizeModal(draw) {
        const prize = draw.prize;
        const rarity = prize.rarity || "common";
        const rarityText = RARITY_LABELS[rarity] || rarity;
        
        refs.modalCard.dataset.rarity = rarity;
        refs.modalRarityBadge.textContent = `★ ${rarityText}级 奖品 ★`;
        refs.modalPrizeIcon.innerHTML = prizeIcon(prize);
        refs.modalPrizeTitle.textContent = prize.name;
        
        let desc = "恭喜在摇摇乐开箱中斩获奖励！";
        if (prize.type === "balance") desc = `已向您的账户增加 ￥${prize.value || 0} 余额。`;
        else if (prize.type === "extra_draw") desc = `额外获得 1 张摇摇卡，可继续抽奖！`;
        refs.modalPrizeDesc.textContent = desc;

        if (draw.status === "delivery_failed") {
          refs.modalStatusTag.textContent = "奖励发放失败 (可在记录中重试)";
          refs.modalStatusTag.className = "modal-status-tag error";
        } else {
          refs.modalStatusTag.textContent = "已实时存入您的账号";
          refs.modalStatusTag.className = "modal-status-tag success";
        }

        refs.prizeModal.setAttribute("aria-hidden", "false");
        refs.prizeModal.classList.add("active");
        playVictoryChime(rarity);
      }

      function hidePrizeModal() {
        refs.prizeModal.classList.remove("active");
        refs.prizeModal.setAttribute("aria-hidden", "true");
      }

      function animateResult(draw) {
        return new Promise((resolve) => {
          const targetIndex = reducedMotion.matches ? 4 : 30;
          const fillers = Array.from({ length: targetIndex + 6 }, (_, index) => (
            index === targetIndex ? draw.prize : state.prizes[(index * 7 + 3) % state.prizes.length]
          ));
          refs.caseTrack.classList.remove("spinning");
          refs.caseTrack.style.transform = "translate3d(0, 0, 0)";
          refs.caseTrack.innerHTML = fillers.map((prize, index) => prizeItem(prize, index === targetIndex)).join("");
          const target = refs.caseTrack.querySelector("[data-target-prize]");
          const viewport = refs.caseTrack.parentElement;
          const destination = -(target.offsetLeft + target.offsetWidth / 2 - viewport.clientWidth / 2);
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (!reducedMotion.matches) refs.caseTrack.classList.add("spinning");
            refs.caseTrack.style.transform = `translate3d(${destination}px, 0, 0)`;
            if (!reducedMotion.matches) {
              let ticks = 0;
              const tickTimer = window.setInterval(() => {
                ticks += 1;
                audioTick(360 + ticks * 16);
                if (ticks >= 18) window.clearInterval(tickTimer);
              }, 220);
            }
            window.setTimeout(() => {
              audioTick(draw.prize.rarity === "legendary" ? 980 : 720, 0.22);
              showPrizeModal(draw);
              resolve();
            }, reducedMotion.matches ? 40 : 5500);
          }));
        });
      }

      async function openCase(requestId = "") {
        if (state.spinning || !state.sessionToken) return;
        state.spinning = true;
        updateButtonState();
        refs.resultReveal.textContent = "";
        setStatus(requestId ? "正在重试奖励发放..." : "正在锁定开箱结果...");
        const drawRequestId = requestId || `opening-${crypto.randomUUID()}`;
        try {
          const payload = await request("/api/public/sub2api/shake/draws", {
            method: "POST", body: JSON.stringify({ requestId: drawRequestId })
          });
          await animateResult(payload.draw);
          state.availableCards = Number(payload.availableCards || 0);
          refs.availableCards.textContent = state.availableCards;
          refs.resultReveal.textContent = payload.draw.prize.name;
          refs.resultReveal.dataset.rarity = payload.draw.prize.rarity;
          if (payload.draw.status === "delivery_failed") {
            state.retryRequestId = payload.draw.requestId;
            setStatus("结果已保存，奖励发放失败，可在记录中重试", "error");
          } else {
            state.retryRequestId = "";
            setStatus("奖励已发放", "success");
          }
          const existing = state.draws.findIndex((item) => item.id === payload.draw.id);
          if (existing >= 0) state.draws[existing] = payload.draw;
          else state.draws.unshift(payload.draw);
          renderHistory();
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          state.spinning = false;
          updateButtonState();
        }
      }

      async function refresh() {
        if (!state.sessionToken || state.spinning) return;
        refs.refreshBtn.disabled = true;
        try {
          const payload = await request("/api/public/sub2api/shake/bootstrap");
          render(payload);
          setStatus("已刷新", "success");
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          refs.refreshBtn.disabled = false;
        }
      }

      async function initialize() {
        const params = new URLSearchParams(window.location.search);
        if (window.self !== window.top || params.get("ui_mode") === "embedded") {
          document.body.classList.add("embedded");
        }
        const sso = params.get("sso") || "";
        const connectionId = params.get("connectionId") || params.get("connection_id") || params.get("connection") || "";
        const embeddedToken = params.get("token") || "";
        const embeddedUserId = params.get("user_id") || params.get("userId") || "";
        if (!sso && !connectionId) return setStatus("缺少 SSO token 或 connectionId", "error");
        try {
          const accessToken = embeddedToken || readAccessToken();
          const refreshToken = localStorage.getItem("refresh_token") || "";
          const payload = sso
            ? await request("/api/public/sub2api/shake/session", { method: "POST", body: JSON.stringify({ sso }) })
            : await request("/api/public/sub2api/shake/session-from-token", {
                method: "POST", body: JSON.stringify({ connectionId, accessToken, refreshToken, userId: embeddedUserId })
              });
          render(payload);
          setStatus(payload.campaign ? "" : "当前没有进行中的活动");
        } catch (error) {
          setStatus(error.message, "error");
        }
      }

      refs.soundToggle.setAttribute("aria-pressed", String(state.soundEnabled));
      refs.soundToggle.addEventListener("click", () => {
        state.soundEnabled = !state.soundEnabled;
        localStorage.setItem("shake_sound", state.soundEnabled ? "on" : "off");
        refs.soundToggle.setAttribute("aria-pressed", String(state.soundEnabled));
        if (state.soundEnabled) audioTick();
      });
      refs.openCaseBtn.addEventListener("click", () => openCase());
      refs.refreshBtn.addEventListener("click", refresh);
      refs.historyList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-retry-request]");
        if (button) openCase(button.dataset.retryRequest);
      });
      refs.modalClaimBtn.addEventListener("click", hidePrizeModal);
      refs.modalBackdrop.addEventListener("click", hidePrizeModal);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && refs.prizeModal.classList.contains("active")) {
          hidePrizeModal();
        }
      });

      initialize();
    </script>
  </body>
</html>
