<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sub2api 世界杯竞猜</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f9;
        --panel: #ffffff;
        --panel-weak: #f8fafc;
        --line: #d8e0eb;
        --text: #172033;
        --muted: #69778d;
        --accent: #147a5f;
        --accent-strong: #0f624d;
        --danger: #dc2626;
        --warning: #b45309;
        --success: #0f9f6e;
        --shadow: 0 14px 34px rgba(25, 36, 60, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #10151f;
          --panel: #151d2b;
          --panel-weak: #1d2737;
          --line: #2b374b;
          --text: #edf3ff;
          --muted: #99a8bd;
          --accent: #34d399;
          --accent-strong: #10b981;
          --shadow: 0 16px 42px rgba(0, 0, 0, 0.28);
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }

      .shell {
        width: min(1180px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 18px 0 28px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        margin-bottom: 14px;
      }

      .title h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      .title p, .hint, .status-line {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .status-line.error { color: var(--danger); }
      .status-line.success { color: var(--success); }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .primary-btn, .ghost-btn, .choice-btn {
        min-height: 40px;
        border-radius: 7px;
        font-weight: 800;
      }

      .primary-btn {
        border: 0;
        padding: 0 16px;
        background: var(--accent);
        color: #ffffff;
      }

      .primary-btn:hover:not(:disabled) { background: var(--accent-strong); }

      .ghost-btn {
        border: 1px solid var(--line);
        padding: 0 14px;
        background: var(--panel);
        color: var(--text);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .metric, .panel, .match-card, .bet-slip {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .metric {
        padding: 14px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 7px;
      }

      .metric strong {
        font-size: 23px;
        line-height: 1.1;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 14px;
        align-items: start;
      }

      .panel {
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 15px 16px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h2 {
        margin: 0;
        font-size: 17px;
      }

      .match-list, .history-list, .leaderboard {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .match-card {
        box-shadow: none;
        padding: 14px;
      }

      .match-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        margin-bottom: 12px;
      }

      .teams {
        font-weight: 900;
        font-size: 18px;
        line-height: 1.25;
      }

      .meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 9px;
        background: var(--panel-weak);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .badge.open { color: var(--success); }
      .badge.locked, .badge.finished { color: var(--warning); }
      .badge.settled { color: var(--accent); }
      .badge.cancelled { color: var(--danger); }

      .odds-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .choice-btn {
        border: 1px solid var(--line);
        background: var(--panel-weak);
        color: var(--text);
        padding: 8px 10px;
      }

      .choice-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }

      .choice-btn small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-weight: 700;
      }

      .bet-slip {
        position: sticky;
        top: 14px;
        overflow: hidden;
      }

      .bet-body {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
        padding: 0 11px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
      }

      .slip-line {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: baseline;
        font-size: 14px;
      }

      .slip-line span {
        color: var(--muted);
        font-size: 12px;
      }

      .slip-line strong {
        text-align: right;
      }

      .history-item, .rank-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-weak);
      }

      .history-item strong, .rank-row strong {
        display: block;
        font-size: 14px;
      }

      .history-item span, .rank-row span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .amount {
        font-weight: 900;
        color: var(--accent);
        text-align: right;
      }

      .empty {
        padding: 22px 14px;
        color: var(--muted);
        text-align: center;
        font-size: 14px;
      }

      @media (max-width: 900px) {
        .shell { width: calc(100vw - 20px); padding-top: 10px; }
        .topbar, .layout, .match-top { grid-template-columns: 1fr; }
        .actions { justify-content: stretch; }
        .actions button { flex: 1; }
        .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .bet-slip { position: static; }
      }

      @media (max-width: 560px) {
        .summary, .odds-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>世界杯竞猜</h1>
          <p id="account-line">正在识别账号...</p>
          <p id="status-line" class="status-line"></p>
        </div>
        <div class="actions">
          <button id="refresh-btn" class="ghost-btn" type="button">刷新</button>
        </div>
      </header>

      <section class="summary">
        <article class="metric">
          <span>当前余额</span>
          <strong id="balance-value">-</strong>
        </article>
        <article class="metric">
          <span>可竞猜比赛</span>
          <strong id="open-count">-</strong>
        </article>
        <article class="metric">
          <span>我的投注</span>
          <strong id="bet-count">-</strong>
        </article>
        <article class="metric">
          <span>累计派奖</span>
          <strong id="payout-value">-</strong>
        </article>
      </section>

      <section class="layout">
        <div class="panel">
          <div class="panel-head">
            <h2>比赛</h2>
            <span id="rule-line" class="hint"></span>
          </div>
          <div id="match-list" class="match-list"></div>
        </div>

        <aside class="bet-slip">
          <div class="panel-head">
            <h2>投注单</h2>
            <span id="slip-status" class="hint">未选择比赛</span>
          </div>
          <div class="bet-body">
            <div class="slip-line">
              <span>比赛</span>
              <strong id="slip-match">-</strong>
            </div>
            <div class="slip-line">
              <span>选择</span>
              <strong id="slip-prediction">-</strong>
            </div>
            <div class="slip-line">
              <span>赔率</span>
              <strong id="slip-odds">-</strong>
            </div>
            <label class="field">
              <span>投注额</span>
              <input id="stake-input" type="number" min="0.01" step="0.01" placeholder="输入小额余额" />
            </label>
            <div class="slip-line">
              <span>预计命中返还</span>
              <strong id="slip-return">-</strong>
            </div>
            <button id="submit-bet-btn" class="primary-btn" type="button" disabled>提交竞猜</button>
          </div>
        </aside>
      </section>

      <section class="layout" style="margin-top:14px">
        <div class="panel">
          <div class="panel-head"><h2>我的记录</h2></div>
          <div id="history-list" class="history-list"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>排行榜</h2></div>
          <div id="leaderboard" class="leaderboard"></div>
        </div>
      </section>
    </main>

    <script src="./runtime-config.js"></script>
    <script>
      const configuredApiBase = String(globalThis.KAWANG_CONFIG?.apiUrl || "").trim();
      const API_BASE = configuredApiBase ? configuredApiBase.replace(/\/+$/, "") : "";
      const refs = {
        accountLine: document.querySelector("#account-line"),
        statusLine: document.querySelector("#status-line"),
        refreshBtn: document.querySelector("#refresh-btn"),
        balanceValue: document.querySelector("#balance-value"),
        openCount: document.querySelector("#open-count"),
        betCount: document.querySelector("#bet-count"),
        payoutValue: document.querySelector("#payout-value"),
        ruleLine: document.querySelector("#rule-line"),
        matchList: document.querySelector("#match-list"),
        slipStatus: document.querySelector("#slip-status"),
        slipMatch: document.querySelector("#slip-match"),
        slipPrediction: document.querySelector("#slip-prediction"),
        slipOdds: document.querySelector("#slip-odds"),
        stakeInput: document.querySelector("#stake-input"),
        slipReturn: document.querySelector("#slip-return"),
        submitBetBtn: document.querySelector("#submit-bet-btn"),
        historyList: document.querySelector("#history-list"),
        leaderboard: document.querySelector("#leaderboard")
      };

      const state = {
        sessionToken: "",
        account: null,
        connection: null,
        matches: [],
        bets: [],
        leaderboard: [],
        selectedMatchId: "",
        selectedPrediction: "",
        selectedOdds: 0
      };

      const PREDICTION_LABELS = {
        home: "主胜",
        draw: "平局",
        away: "客胜"
      };

      const STATUS_LABELS = {
        open: "可下注",
        locked: "已锁定",
        finished: "待结算",
        settled: "已结算",
        cancelled: "已取消",
        debiting: "扣款中",
        placed: "已投注",
        won: "已命中",
        lost: "未命中",
        refunded: "已退款",
        debit_failed: "扣款失败",
        payout_failed: "派奖失败",
        refund_failed: "退款失败"
      };

      const DISPLAY_ROLE_LABELS = {
        current: "当前赛事",
        next: "下一场",
        preview: "下下场"
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#39;");
      }

      function setStatus(message, type = "info") {
        refs.statusLine.textContent = message || "";
        refs.statusLine.classList.toggle("error", type === "error");
        refs.statusLine.classList.toggle("success", type === "success");
      }

      function formatAmount(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "-";
        return number.toFixed(2).replace(/\.00$/, "");
      }

      const BEIJING_TIME_FORMATTER = new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      });

      function formatTime(value) {
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return "-";
        const parts = Object.fromEntries(
          BEIJING_TIME_FORMATTER.formatToParts(date)
            .filter((part) => part.type !== "literal")
            .map((part) => [part.type, part.value])
        );
        return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second || "00"} 北京时间`;
      }

      function statusLabel(value) {
        return STATUS_LABELS[value] || value || "-";
      }

      function predictionLabel(value) {
        return PREDICTION_LABELS[value] || value || "-";
      }

      async function request(path, options = {}) {
        const headers = {
          "Content-Type": "application/json",
          ...(options.headers || {})
        };
        if (state.sessionToken) headers.Authorization = `Bearer ${state.sessionToken}`;
        let response;
        try {
          response = await fetch(`${API_BASE}${path}`, { ...options, headers });
        } catch (error) {
          const target = API_BASE ? `${API_BASE}${path}` : path;
          const configHint = API_BASE
            ? "请确认该 API 地址可从当前浏览器访问，并且 HTTPS/反代/CORS 配置正确。"
            : "未读取到 runtime-config.js，请确认当前路径下的 runtime-config.js 指向 KaWang API，例如 https://api.vsakura.top。";
          throw new Error(`无法连接 API：${target}。${configHint} 原始错误：${error.message || "Failed to fetch"}`);
        }
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.message || "请求失败");
        }
        return payload;
      }

      function readSub2ApiAccessToken() {
        return localStorage.getItem("auth_token")
          || localStorage.getItem("access_token")
          || localStorage.getItem("token")
          || "";
      }

      function getSelectedMatch() {
        return state.matches.find((item) => item.id === state.selectedMatchId) || null;
      }

      function canSubmit() {
        const match = getSelectedMatch();
        const stake = Number(refs.stakeInput.value);
        return Boolean(
          state.sessionToken
          && match
          && match.bettingOpen
          && !match.myBetForCurrentPhase
          && state.selectedPrediction
          && Number.isFinite(stake)
          && stake >= Number(match.minStake)
          && stake <= Number(match.maxStake)
        );
      }

      function renderAccount(payload) {
        if (payload.sessionToken) state.sessionToken = payload.sessionToken;
        state.account = payload.account || {};
        state.connection = payload.connection || {};
        const name = state.account.email || state.account.username || state.account.userId || "-";
        refs.accountLine.textContent = `${name}${state.connection?.name ? ` · ${state.connection.name}` : ""}`;
        refs.balanceValue.textContent = payload.balance === null || payload.balance === undefined
          ? "-"
          : formatAmount(payload.balance);
        if (payload.balanceError) {
          setStatus(`余额读取失败：${payload.balanceError}`, "error");
        }
      }

      function renderSummary(payload) {
        const matches = payload.matches || [];
        const bets = payload.bets || [];
        refs.openCount.textContent = matches.filter((item) => item.bettingOpen && !item.myBetForCurrentPhase).length;
        refs.betCount.textContent = bets.length;
        refs.payoutValue.textContent = formatAmount(bets.reduce((sum, item) => sum + Number(item.payout || 0), 0));
        refs.ruleLine.textContent = payload.settings?.ruleText || "";
      }

      function renderBetLine(bet) {
        if (!bet) return "";
        return `<div class="hint">${escapeHtml(bet.phaseLabel || "")}已选 ${escapeHtml(bet.predictionLabel)}，投注 ${escapeHtml(formatAmount(bet.stake))}，状态 ${escapeHtml(statusLabel(bet.status))}</div>`;
      }

      function renderMatches(matches) {
        if (!matches.length) {
          refs.matchList.innerHTML = `<div class="empty">暂无比赛</div>`;
          return;
        }
        refs.matchList.innerHTML = matches.map((item) => {
          const disabled = !item.bettingOpen || item.myBetForCurrentPhase;
          const betLines = [
            renderBetLine(item.myBets?.preMatch),
            renderBetLine(item.myBets?.halftime)
          ].filter(Boolean).join("");
          const score = item.homeScore === null || item.homeScore === undefined
            ? ""
            : `<div class="hint">比分 ${escapeHtml(item.homeScore)} - ${escapeHtml(item.awayScore)} · ${escapeHtml(item.resultLabel || "-")}</div>`;
          const role = DISPLAY_ROLE_LABELS[item.displayRole] || "";
          const phaseText = item.bettingOpen
            ? item.bettingPhaseLabel
            : (item.bettingClosedReason || statusLabel(item.status));
          return `
            <article class="match-card">
              <div class="match-top">
                <div>
                  <div class="teams">${escapeHtml(item.homeTeam)} <span class="hint">vs</span> ${escapeHtml(item.awayTeam)}</div>
                  <div class="meta">${role ? `${escapeHtml(role)} · ` : ""}${escapeHtml(item.stage || "-")}${item.groupName ? ` · ${escapeHtml(item.groupName)}` : ""} · ${escapeHtml(formatTime(item.kickoffAt))}</div>
                  ${betLines}
                  ${score}
                </div>
                <span class="badge ${item.bettingOpen ? "open" : escapeHtml(item.status)}">${escapeHtml(phaseText)}</span>
              </div>
              <div class="odds-grid">
                ${["home", "draw", "away"].map((prediction) => `
                  <button
                    class="choice-btn ${state.selectedMatchId === item.id && state.selectedPrediction === prediction ? "active" : ""}"
                    type="button"
                    data-match-id="${escapeHtml(item.id)}"
                    data-prediction="${prediction}"
                    data-odds="${escapeHtml(item.odds?.[prediction] || 0)}"
                    ${disabled ? "disabled" : ""}
                  >
                    ${escapeHtml(predictionLabel(prediction))}
                    <small>${escapeHtml(formatAmount(item.odds?.[prediction]))}</small>
                  </button>
                `).join("")}
              </div>
            </article>
          `;
        }).join("");
      }

      function renderSlip() {
        const match = getSelectedMatch();
        const stake = Number(refs.stakeInput.value);
        refs.slipMatch.textContent = match ? `${match.homeTeam} vs ${match.awayTeam}` : "-";
        refs.slipPrediction.textContent = state.selectedPrediction ? predictionLabel(state.selectedPrediction) : "-";
        refs.slipOdds.textContent = state.selectedOdds ? formatAmount(state.selectedOdds) : "-";
        refs.slipReturn.textContent = Number.isFinite(stake) && state.selectedOdds
          ? formatAmount(stake * state.selectedOdds)
          : "-";
        refs.slipStatus.textContent = match
          ? `${match.bettingPhaseLabel || statusLabel(match.status)} · ${formatAmount(match.minStake)} - ${formatAmount(match.maxStake)}`
          : "未选择比赛";
        if (match) {
          refs.stakeInput.min = match.minStake;
          refs.stakeInput.max = match.maxStake;
          if (!refs.stakeInput.value) refs.stakeInput.value = match.minStake;
        }
        refs.submitBetBtn.disabled = !canSubmit();
      }

      function renderHistory(bets) {
        if (!bets.length) {
          refs.historyList.innerHTML = `<div class="empty">暂无投注记录</div>`;
          return;
        }
        refs.historyList.innerHTML = bets.map((item) => `
          <article class="history-item">
            <div>
              <strong>${escapeHtml(item.match ? `${item.match.homeTeam} vs ${item.match.awayTeam}` : item.matchId)}</strong>
              <span>${escapeHtml(item.phaseLabel || "")} · ${escapeHtml(item.predictionLabel)} · 投注 ${escapeHtml(formatAmount(item.stake))} × ${escapeHtml(formatAmount(item.odds))} · ${escapeHtml(statusLabel(item.status))}</span>
            </div>
            <div class="amount">${escapeHtml(formatAmount(item.payout))}</div>
          </article>
        `).join("");
      }

      function renderLeaderboard(items) {
        if (!items.length) {
          refs.leaderboard.innerHTML = `<div class="empty">暂无排行</div>`;
          return;
        }
        refs.leaderboard.innerHTML = items.map((item) => `
          <article class="rank-row">
            <div>
              <strong>#${escapeHtml(item.rank)} ${escapeHtml(item.email || item.username || item.userId)}</strong>
              <span>${escapeHtml(item.betCount)} 注 · 命中 ${escapeHtml(item.winCount)} · 投注 ${escapeHtml(formatAmount(item.totalStake))}</span>
            </div>
            <div class="amount">${escapeHtml(formatAmount(item.net))}</div>
          </article>
        `).join("");
      }

      function render(payload) {
        renderAccount(payload);
        state.matches = payload.matches || [];
        state.bets = payload.bets || [];
        state.leaderboard = payload.leaderboard || [];
        renderSummary(payload);
        renderMatches(state.matches);
        renderHistory(state.bets);
        renderLeaderboard(state.leaderboard);
        renderSlip();
      }

      async function initialize() {
        const params = new URLSearchParams(window.location.search);
        const sso = params.get("sso") || "";
        const connectionId = params.get("connectionId") || params.get("connection_id") || params.get("connection") || "";
        if (!sso && !connectionId) {
          refs.accountLine.textContent = "未识别账号";
          setStatus("缺少 SSO token 或 connectionId", "error");
          return;
        }

        try {
          setStatus("正在识别账号...");
          const accessToken = sso ? "" : readSub2ApiAccessToken();
          if (!sso && !accessToken) {
            throw new Error("未读取到 Sub2api 登录态，请确认页面通过 Sub2api 同源反代打开。");
          }
          const payload = sso
            ? await request("/api/public/sub2api/worldcup/session", {
                method: "POST",
                body: JSON.stringify({ sso })
              })
            : await request("/api/public/sub2api/worldcup/session-from-token", {
                method: "POST",
                body: JSON.stringify({
                  connectionId,
                  accessToken
                })
              });
          render(payload);
          if (!payload.balanceError) setStatus("");
        } catch (error) {
          refs.accountLine.textContent = "账号识别失败";
          setStatus(error.message, "error");
        }
      }

      async function refresh() {
        if (!state.sessionToken) return;
        try {
          refs.refreshBtn.disabled = true;
          const payload = await request("/api/public/sub2api/worldcup/bootstrap");
          render(payload);
          setStatus("已刷新", "success");
          window.setTimeout(() => setStatus(""), 1500);
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          refs.refreshBtn.disabled = false;
        }
      }

      async function submitBet() {
        const match = getSelectedMatch();
        if (!match || !canSubmit()) return;
        const stake = Number(refs.stakeInput.value);
        const phasePrefix = match.bettingPhaseLabel ? `${match.bettingPhaseLabel}，` : "";
        const message = `确认投注 ${match.homeTeam} vs ${match.awayTeam}：${phasePrefix}${predictionLabel(state.selectedPrediction)}，金额 ${formatAmount(stake)}？`;
        if (!window.confirm(message)) return;

        try {
          refs.submitBetBtn.disabled = true;
          refs.submitBetBtn.textContent = "提交中...";
          setStatus("正在扣款并提交竞猜...");
          const payload = await request("/api/public/sub2api/worldcup/bets", {
            method: "POST",
            body: JSON.stringify({
              matchId: match.id,
              prediction: state.selectedPrediction,
              stake
            })
          });
          state.selectedMatchId = "";
          state.selectedPrediction = "";
          state.selectedOdds = 0;
          refs.stakeInput.value = "";
          render(payload);
          setStatus("竞猜已提交", "success");
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          refs.submitBetBtn.textContent = "提交竞猜";
          renderSlip();
        }
      }

      refs.matchList.addEventListener("click", (event) => {
        const button = event.target.closest(".choice-btn");
        if (!button || button.disabled) return;
        state.selectedMatchId = button.dataset.matchId || "";
        state.selectedPrediction = button.dataset.prediction || "";
        state.selectedOdds = Number(button.dataset.odds || 0);
        refs.stakeInput.value = "";
        renderMatches(state.matches);
        renderSlip();
      });

      refs.stakeInput.addEventListener("input", renderSlip);
      refs.refreshBtn.addEventListener("click", refresh);
      refs.submitBetBtn.addEventListener("click", submitBet);

      initialize();
    </script>
  </body>
</html>
